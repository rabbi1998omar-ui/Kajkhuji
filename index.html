<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#111827"
>

<title>কাজ খুঁজি 💼</title>


<style>

/* ==============================
   RESET
============================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #080b14,
      #111827,
      #172033
    );

  color:#fff;

  min-height:100vh;

}


/* ==============================
   AUTH
============================== */

.auth{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

}


.auth-box{

  width:100%;

  max-width:420px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:25px;

  padding:25px;

  backdrop-filter:blur(20px);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);

}


.logo{

  text-align:center;

  font-size:36px;

  margin-bottom:8px;

}


.auth-title{

  text-align:center;

  font-size:25px;

  font-weight:800;

}


.auth-subtitle{

  text-align:center;

  color:#9ca3af;

  margin-top:6px;

  margin-bottom:25px;

}


.tabs{

  display:flex;

  gap:8px;

  margin-bottom:20px;

}


.tab{

  flex:1;

  border:none;

  padding:12px;

  border-radius:12px;

  background:#1f2937;

  color:#9ca3af;

  font-size:15px;

  cursor:pointer;

}


.tab.active{

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  color:#fff;

}


.input{

  width:100%;

  padding:14px;

  border-radius:13px;

  border:
    1px solid
    rgba(255,255,255,.1);

  background:
    rgba(255,255,255,.06);

  color:#fff;

  outline:none;

  margin-bottom:12px;

  font-size:15px;

}


.input::placeholder{

  color:#8b93a3;

}


.input:focus{

  border-color:#8b5cf6;

}


.primary{

  width:100%;

  border:none;

  border-radius:13px;

  padding:14px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  color:#fff;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

}


.message{

  margin-top:12px;

  text-align:center;

  font-size:14px;

  color:#fca5a5;

}


/* ==============================
   APP
============================== */

#app{

  display:none;

  min-height:100vh;

  padding-bottom:85px;

}


.container{

  width:100%;

  max-width:900px;

  margin:auto;

  padding:15px;

}


/* ==============================
   HEADER
============================== */

.header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:12px 0 20px;

}


.brand{

  font-size:25px;

  font-weight:900;

}


.brand span{

  color:#a78bfa;

}


.header-user{

  width:42px;

  height:42px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  cursor:pointer;

}


/* ==============================
   SEARCH
============================== */

.search{

  display:flex;

  align-items:center;

  gap:10px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:15px;

  padding:0 15px;

  margin-bottom:20px;

}


.search input{

  flex:1;

  border:none;

  outline:none;

  background:transparent;

  color:#fff;

  padding:14px 0;

  font-size:15px;

}


.search span{

  font-size:20px;

}


/* ==============================
   SECTION
============================== */

.section-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin:20px 0 12px;

}


.section-title h2{

  font-size:19px;

}


.section-title button{

  background:none;

  border:none;

  color:#a78bfa;

  cursor:pointer;

}


/* ==============================
   CATEGORIES
============================== */

.categories{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:9px;

}


.category{

  border:none;

  border-radius:15px;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.07);

  color:#fff;

  padding:13px 5px;

  cursor:pointer;

}


.category-icon{

  font-size:23px;

  display:block;

  margin-bottom:5px;

}


.category-name{

  font-size:11px;

}


/* ==============================
   JOB CARD
============================== */

.jobs{

  display:flex;

  flex-direction:column;

  gap:12px;

}


.job{

  background:
    rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:20px;

  padding:17px;

}


.job-top{

  display:flex;

  justify-content:space-between;

  gap:10px;

}


.job-title{

  font-size:18px;

  font-weight:800;

}


.job-category{

  display:inline-block;

  margin-top:7px;

  padding:5px 9px;

  border-radius:8px;

  background:
    rgba(139,92,246,.18);

  color:#c4b5fd;

  font-size:11px;

}


.job-info{

  color:#b8c0ce;

  font-size:13px;

  margin-top:10px;

  line-height:1.7;

}


.job-description{

  color:#d1d5db;

  font-size:14px;

  margin-top:10px;

  line-height:1.6;

}


.job-actions{

  display:flex;

  gap:8px;

  margin-top:14px;

}


.btn{

  flex:1;

  border:none;

  border-radius:11px;

  padding:10px;

  cursor:pointer;

  font-weight:700;

}


.chat-btn{

  background:#312e81;

  color:#c4b5fd;

}


.call-btn{

  background:#064e3b;

  color:#6ee7b7;

}


.delete-btn{

  background:#450a0a;

  color:#fca5a5;

}


/* ==============================
   PROFILE
============================== */

.profile-card{

  background:
    rgba(255,255,255,.06);

  border-radius:20px;

  padding:20px;

  text-align:center;

}


.avatar{

  width:75px;

  height:75px;

  border-radius:50%;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:35px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

}


.profile-name{

  font-size:21px;

  font-weight:800;

  margin-top:10px;

}


.profile-phone{

  color:#9ca3af;

  margin-top:4px;

}


.profile-location{

  color:#c4b5fd;

  margin-top:6px;

}


/* ==============================
   BOTTOM NAV
============================== */

.bottom-nav{

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  height:70px;

  background:
    rgba(10,14,25,.94);

  border-top:
    1px solid
    rgba(255,255,255,.08);

  display:flex;

  justify-content:center;

  z-index:100;

}


.nav-inner{

  width:100%;

  max-width:700px;

  display:flex;

  justify-content:space-around;

}


.nav-btn{

  flex:1;

  background:none;

  border:none;

  color:#8b93a3;

  cursor:pointer;

  font-size:11px;

}


.nav-icon{

  display:block;

  font-size:22px;

  margin-bottom:3px;

}


.nav-btn.active{

  color:#c4b5fd;

}


/* ==============================
   FLOAT BUTTON
============================== */

.floating{

  position:fixed;

  right:20px;

  bottom:85px;

  width:58px;

  height:58px;

  border:none;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  color:#fff;

  font-size:28px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.4);

  cursor:pointer;

  z-index:90;

}


/* ==============================
   MODAL
============================== */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.7);

  z-index:200;

  padding:15px;

  overflow:auto;

}


.modal-box{

  width:100%;

  max-width:520px;

  margin:50px auto;

  background:#111827;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:22px;

  padding:20px;

}


.modal-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;

}


.modal-head h2{

  font-size:21px;

}


.close{

  border:none;

  background:#1f2937;

  color:#fff;

  width:35px;

  height:35px;

  border-radius:50%;

  font-size:22px;

  cursor:pointer;

}


/* ==============================
   CHAT
============================== */

.chat-messages{

  height:380px;

  overflow-y:auto;

  padding:8px;

  background:
    rgba(0,0,0,.18);

  border-radius:15px;

}


.chat-empty{

  text-align:center;

  color:#8b93a3;

  padding:100px 10px;

}


.chat-row{

  display:flex;

  margin:8px 0;

}


.chat-row.mine{

  justify-content:flex-end;

}


.chat-bubble{

  max-width:78%;

  padding:10px 13px;

  border-radius:16px;

  background:#26324a;

  word-break:break-word;

}


.chat-row.mine
.chat-bubble{

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

}


.chat-time{

  font-size:9px;

  opacity:.65;

  margin-top:4px;

  text-align:right;

}


.chat-input-row{

  display:flex;

  gap:8px;

  margin-top:10px;

}


.chat-input-row .input{

  margin:0;

}


.send-btn{

  width:58px;

  border:none;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  color:#fff;

  font-size:22px;

  cursor:pointer;

}


/* ==============================
   LOADING
============================== */

.loading{

  text-align:center;

  color:#9ca3af;

  padding:30px;

}


.empty{

  text-align:center;

  color:#9ca3af;

  padding:30px;

}


/* ==============================
   RESPONSIVE
============================== */

@media(max-width:500px){

  .categories{

    grid-template-columns:
      repeat(4,1fr);

  }

  .category{

    padding:10px 3px;

  }

  .category-icon{

    font-size:20px;

  }

}

</style>

</head>


<body>


<!-- =================================
     AUTH
================================= -->

<div
  id="auth"
  class="auth"
>

  <div class="auth-box">

    <div class="logo">
      💼
    </div>

    <div class="auth-title">
      কাজ খুঁজি
    </div>

    <div class="auth-subtitle">
      কাজ খুঁজুন, কাজ দিন
    </div>


    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        onclick="showLogin()"
      >
        লগইন
      </button>

      <button
        id="registerTab"
        class="tab"
        onclick="showRegister()"
      >
        রেজিস্টার
      </button>

    </div>


    <!-- LOGIN -->

    <div id="loginForm">

      <input
        id="loginPhone"
        class="input"
        type="tel"
        placeholder="📱 ফোন নম্বর"
      >

      <input
        id="loginPin"
        class="input"
        type="password"
        inputmode="numeric"
        placeholder="🔐 PIN"
      >

      <button
        class="primary"
        onclick="login()"
      >
        লগইন
      </button>

    </div>


    <!-- REGISTER -->

    <div
      id="registerForm"
      style="display:none"
    >

      <input
        id="registerName"
        class="input"
        placeholder="👤 আপনার নাম"
      >

      <input
        id="registerPhone"
        class="input"
        type="tel"
        placeholder="📱 ফোন নম্বর"
      >

      <input
        id="registerLocation"
        class="input"
        placeholder="📍 আপনার এলাকা"
      >

      <input
        id="registerPin"
        class="input"
        type="password"
        inputmode="numeric"
        placeholder="🔐 ৪+ সংখ্যার PIN"
      >

      <button
        class="primary"
        onclick="register()"
      >
        অ্যাকাউন্ট তৈরি করুন
      </button>

    </div>


    <div
      id="authMessage"
      class="message"
    ></div>

  </div>

</div>



<!-- =================================
     MAIN APP
================================= -->

<div id="app">

  <div class="container">


    <!-- HEADER -->

    <div class="header">

      <div class="brand">
        💼 <span>কাজ খুঁজি</span>
      </div>

      <div
        class="header-user"
        onclick="showProfile()"
      >
        👤
      </div>

    </div>


    <!-- SEARCH -->

    <div class="search">

      <span>🔍</span>

      <input
        id="searchInput"
        placeholder="কাজ খুঁজুন..."
        oninput="searchJobs()"
      >

    </div>


    <!-- HOME -->

    <div id="homePage">


      <div class="section-title">

        <h2>
          কাজের ধরন
        </h2>

      </div>


      <div class="categories">

        <button
          class="category"
          onclick="filterCategory('রাজমিস্ত্রি')"
        >
          <span class="category-icon">
            🧱
          </span>
          <span class="category-name">
            রাজমিস্ত্রি
          </span>
        </button>


        <button
          class="category"
          onclick="filterCategory('ইলেকট্রিশিয়ান')"
        >
          <span class="category-icon">
            ⚡
          </span>
          <span class="category-name">
            ইলেকট্রিশিয়ান
          </span>
        </button>


        <button
          class="category"
          onclick="filterCategory('ড্রাইভার')"
        >
          <span class="category-icon">
            🚗
          </span>
          <span class="category-name">
            ড্রাইভার
          </span>
        </button>


        <button
          class="category"
          onclick="filterCategory('ডেলিভারি')"
        >
          <span class="category-icon">
            📦
          </span>
          <span class="category-name">
            ডেলিভারি
          </span>
        </button>


        <button
          class="category"
          onclick="filterCategory('দোকান')"
        >
          <span class="category-icon">
            🏪
          </span>
          <span class="category-name">
            দোকান
          </span>
        </button>


        <button
          class="category"
          onclick="filterCategory('কম্পিউটার')"
        >
          <span class="category-icon">
            💻
          </span>
          <span class="category-name">
            কম্পিউটার
          </span>
        </button>


        <button
          class="category"
          onclick="filterCategory('টিউশনি')"
        >
          <span class="category-icon">
            📚
          </span>
          <span class="category-name">
            টিউশনি
          </span>
        </button>


        <button
          class="category"
          onclick="filterCategory('অন্যান্য')"
        >
          <span class="category-icon">
            🔧
          </span>
          <span class="category-name">
            অন্যান্য
          </span>
        </button>

      </div>


      <div class="section-title">

        <h2>
          🆕 নতুন কাজ
        </h2>

        <button
          onclick="showJobs()"
        >
          সব দেখুন
        </button>

      </div>


      <div
        id="homeJobs"
        class="jobs"
      >

        <div class="loading">
          কাজ লোড হচ্ছে...
        </div>

      </div>

    </div>



    <!-- JOBS PAGE -->

    <div
      id="jobsPage"
      style="display:none"
    >

      <div class="section-title">

        <h2>
          🔎 সব কাজ
        </h2>

      </div>


      <div
        id="allJobs"
        class="jobs"
      ></div>

    </div>



    <!-- PROFILE PAGE -->

    <div
      id="profilePage"
      style="display:none"
    >

      <div class="section-title">

        <h2>
          👤 আমার প্রোফাইল
        </h2>

      </div>


      <div
        id="profileContent"
      ></div>


      <div class="section-title">

        <h2>
          📌 আমার পোস্ট
        </h2>

      </div>


      <div
        id="myJobs"
        class="jobs"
      ></div>


      <button
        class="primary"
        style="
          margin-top:20px;
          background:#450a0a;
          color:#fca5a5;
        "
        onclick="logout()"
      >
        লগআউট
      </button>

    </div>

  </div>



  <!-- FLOATING BUTTON -->

  <button
    class="floating"
    onclick="openPostModal()"
  >
    +
  </button>



  <!-- BOTTOM NAV -->

  <div class="bottom-nav">

    <div class="nav-inner">

      <button
        id="navHome"
        class="nav-btn active"
        onclick="showHome()"
      >

        <span class="nav-icon">
          🏠
        </span>

        হোম

      </button>


      <button
        id="navJobs"
        class="nav-btn"
        onclick="showJobs()"
      >

        <span class="nav-icon">
          🔎
        </span>

        কাজ

      </button>


      <button
        class="nav-btn"
        onclick="openPostModal()"
      >

        <span class="nav-icon">
          ➕
        </span>

        পোস্ট

      </button>


      <button
        id="navProfile"
        class="nav-btn"
        onclick="showProfile()"
      >

        <span class="nav-icon">
          👤
        </span>

        প্রোফাইল

      </button>

    </div>

  </div>

</div>



<!-- =================================
     POST MODAL
================================= -->

<div
  id="postModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        📢 নতুন কাজ পোস্ট
      </h2>

      <button
        class="close"
        onclick="closePostModal()"
      >
        ×
      </button>

    </div>


    <input
      id="jobTitle"
      class="input"
      placeholder="কাজের নাম"
    >


    <input
      id="jobLocation"
      class="input"
      placeholder="📍 কাজের জায়গা"
    >


    <input
      id="jobSalary"
      class="input"
      placeholder="💰 বেতন / পারিশ্রমিক"
    >


    <select
      id="jobCategory"
      class="input"
    >

      <option value="">
        কাজের ধরন নির্বাচন করুন
      </option>

      <option>
        রাজমিস্ত্রি
      </option>

      <option>
        ইলেকট্রিশিয়ান
      </option>

      <option>
        ড্রাইভার
      </option>

      <option>
        ডেলিভারি
      </option>

      <option>
        দোকান
      </option>

      <option>
        কম্পিউটার
      </option>

      <option>
        টিউশনি
      </option>

      <option>
        অন্যান্য
      </option>

    </select>


    <textarea
      id="jobDescription"
      class="input"
      rows="5"
      placeholder="কাজ সম্পর্কে বিস্তারিত লিখুন..."
    ></textarea>


    <button
      class="primary"
      onclick="createJob()"
    >
      কাজ পোস্ট করুন
    </button>

  </div>

</div>



<!-- =================================
     CHAT MODAL
================================= -->

<div
  id="chatModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="chatTitle">
        💬 Chat
      </h2>

      <button
        class="close"
        onclick="closeChat()"
      >
        ×
      </button>

    </div>


    <div
      id="chatMessages"
      class="chat-messages"
    >

      <div class="loading">
        Chat লোড হচ্ছে...
      </div>

    </div>


    <div class="chat-input-row">

      <input
        id="chatInput"
        class="input"
        placeholder="বার্তা লিখুন..."
        onkeydown="
          if(event.key==='Enter')
          sendMessage()
        "
      >

      <button
        class="send-btn"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>



<script>

/* =================================
   CONFIG
================================= */

const API =
  window.location.origin;


let currentUser =
  null;

let allJobs =
  [];

let chatUser =
  null;

let chatTimer =
  null;


/* =================================
   AUTH ELEMENTS
================================= */

function showLogin(){

  document
    .getElementById("loginForm")
    .style.display="block";

  document
    .getElementById("registerForm")
    .style.display="none";


  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");


  clearMessage();

}


function showRegister(){

  document
    .getElementById("loginForm")
    .style.display="none";

  document
    .getElementById("registerForm")
    .style.display="block";


  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");


  clearMessage();

}


function showMessage(message){

  document
    .getElementById("authMessage")
    .textContent =
      message;

}


function clearMessage(){

  document
    .getElementById("authMessage")
    .textContent =
      "";

}


/* =================================
   REGISTER
================================= */

async function register(){

  const name =
    document
      .getElementById(
        "registerName"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "registerPhone"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "registerLocation"
      )
      .value
      .trim();


  const pin =
    document
      .getElementById(
        "registerPin"
      )
      .value
      .trim();


  if(
    !name ||
    !phone ||
    !location ||
    !pin
  ){

    showMessage(
      "সব তথ্য পূরণ করুন।"
    );

    return;

  }


  showMessage(
    "অ্যাকাউন্ট তৈরি হচ্ছে..."
  );


  try{

    const response =
      await fetch(
        API +
        "/api/register",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              name,

              phone,

              location,

              pin

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      showMessage(
        data.message ||
        "রেজিস্টার করা যায়নি।"
      );

      return;

    }


    currentUser =
      data.user;


    localStorage.setItem(
      "kajKhujiUser",
      JSON.stringify(
        currentUser
      )
    );


    openApp();


  }catch(error){

    showMessage(
      "সার্ভারের সঙ্গে যোগাযোগ করা যাচ্ছে না।"
    );

  }

}


/* =================================
   LOGIN
================================= */

async function login(){

  const phone =
    document
      .getElementById(
        "loginPhone"
      )
      .value
      .trim();


  const pin =
    document
      .getElementById(
        "loginPin"
      )
      .value
      .trim();


  if(!phone || !pin){

    showMessage(
      "ফোন নম্বর ও PIN দিন।"
    );

    return;

  }


  showMessage(
    "লগইন হচ্ছে..."
  );


  try{

    const response =
      await fetch(
        API +
        "/api/login",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              phone,

              pin

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      showMessage(
        data.message ||
        "লগইন করা যায়নি।"
      );

      return;

    }


    currentUser =
      data.user;


    localStorage.setItem(
      "kajKhujiUser",
      JSON.stringify(
        currentUser
      )
    );


    openApp();


  }catch(error){

    showMessage(
      "সার্ভারের সঙ্গে যোগাযোগ করা যাচ্ছে না।"
    );

  }

}


/* =================================
   OPEN APP
================================= */

function openApp(){

  document
    .getElementById("auth")
    .style.display="none";


  document
    .getElementById("app")
    .style.display="block";


  loadJobs();

}


/* =================================
   LOGOUT
================================= */

function logout(){

  localStorage.removeItem(
    "kajKhujiUser"
  );

  currentUser =
    null;


  location.reload();

}


/* =================================
   LOAD USER
================================= */

function loadSavedUser(){

  try{

    const saved =
      localStorage.getItem(
        "kajKhujiUser"
      );


    if(saved){

      currentUser =
        JSON.parse(saved);

      openApp();

    }

  }catch(error){

    localStorage.removeItem(
      "kajKhujiUser"
    );

  }

}


/* =================================
   LOAD JOBS
================================= */

async function loadJobs(){

  try{

    const response =
      await fetch(
        API +
        "/api/jobs"
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error();

    }


    allJobs =
      data.jobs || [];


    renderJobs(
      allJobs,
      "homeJobs"
    );


    renderJobs(
      allJobs,
      "allJobs"
    );


  }catch(error){

    document
      .getElementById(
        "homeJobs"
      )
      .innerHTML =
        `<div class="empty">
          কাজ লোড করা যাচ্ছে না।
        </div>`;

  }

}


/* =================================
   RENDER JOBS
================================= */

function renderJobs(
  jobs,
  elementId
){

  const box =
    document
      .getElementById(
        elementId
      );


  if(!box)
    return;


  if(!jobs.length){

    box.innerHTML =
      `<div class="empty">
        😔 কোনো কাজ পাওয়া যায়নি।
      </div>`;

    return;

  }


  box.innerHTML =
    jobs
      .map(
        jobCard
      )
      .join("");

}


/* =================================
   JOB CARD
================================= */

function jobCard(job){

  const mine =
    currentUser &&
    job.phone ===
      currentUser.phone;


  return `

    <div class="job">

      <div class="job-top">

        <div>

          <div class="job-title">

            ${escapeHtml(
              job.title
            )}

          </div>

          <div class="job-category">

            ${escapeHtml(
              job.category
            )}

          </div>

        </div>

      </div>


      <div class="job-info">

        📍 ${escapeHtml(
          job.location
        )}

        <br>

        💰 ${
          escapeHtml(
            job.salary ||
            "আলোচনা সাপেক্ষে"
          )
        }

        <br>

        👤 ${
          escapeHtml(
            job.ownerName ||
            "কাজদাতা"
          )
        }

      </div>


      <div class="job-description">

        ${escapeHtml(
          job.description
        )}

      </div>


      <div class="job-actions">

        ${
          mine

          ?

          `
          <button
            class="btn delete-btn"
            onclick="
              deleteJob(
                '${job.id}'
              )
            "
          >
            🗑️ মুছুন
          </button>
          `

          :

          `

          <button
            class="btn chat-btn"
            onclick="
              openChat(
                '${escapeAttr(
                  job.phone
                )}',
                '${escapeAttr(
                  job.ownerName ||
                  "কাজদাতা"
                )}'
              )
            "
          >
            💬 Chat
          </button>


          <button
            class="btn call-btn"
            onclick="
              callJob(
                '${escapeAttr(
                  job.phone
                )}'
              )
            "
          >
            📞 কল
          </button>

          `

        }

      </div>

    </div>

  `;

}


/* =================================
   SEARCH
================================= */

function searchJobs(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(!query){

    renderJobs(
      allJobs,
      "homeJobs"
    );

    renderJobs(
      allJobs,
      "allJobs"
    );

    return;

  }


  const result =
    allJobs.filter(
      job =>

        String(
          job.title
        )
        .toLowerCase()
        .includes(query)

        ||

        String(
          job.location
        )
        .toLowerCase()
        .includes(query)

        ||

        String(
          job.category
        )
        .toLowerCase()
        .includes(query)

        ||

        String(
          job.description
        )
        .toLowerCase()
        .includes(query)

    );


  renderJobs(
    result,
    "homeJobs"
  );


  renderJobs(
    result,
    "allJobs"
  );

}


/* =================================
   CATEGORY FILTER
================================= */

function filterCategory(
  category
){

  const result =
    allJobs.filter(
      job =>
        job.category ===
        category
    );


  showJobs();


  renderJobs(
    result,
    "allJobs"
  );

}


/* =================================
   CREATE JOB
================================= */

async function createJob(){

  if(!currentUser)
    return;


  const title =
    document
      .getElementById(
        "jobTitle"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "jobLocation"
      )
      .value
      .trim();


  const salary =
    document
      .getElementById(
        "jobSalary"
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        "jobCategory"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "jobDescription"
      )
      .value
      .trim();


  if(
    !title ||
    !location ||
    !category ||
    !description
  ){

    alert(
      "প্রয়োজনীয় তথ্য পূরণ করুন।"
    );

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "/api/jobs",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              title,

              location,

              salary,

              category,

              description,

              phone:
                currentUser.phone,

              ownerName:
                currentUser.name

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.message ||
        "কাজ পোস্ট করা যায়নি।"
      );

      return;

    }


    closePostModal();


    await loadJobs();


    alert(
      "✅ কাজ সফলভাবে পোস্ট হয়েছে।"
    );


  }catch(error){

    alert(
      "সার্ভারের সঙ্গে যোগাযোগ করা যাচ্ছে না।"
    );

  }

}


/* =================================
   DELETE JOB
================================= */

async function deleteJob(id){

  if(
    !confirm(
      "এই কাজটি মুছে ফেলতে চান?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "/api/jobs/delete",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              id,

              phone:
                currentUser.phone

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.message ||
        "মুছে ফেলা যায়নি।"
      );

      return;

    }


    await loadJobs();

    showProfile();


  }catch(error){

    alert(
      "সার্ভারের সঙ্গে যোগাযোগ করা যাচ্ছে না।"
    );

  }

}


/* =================================
   CALL
================================= */

function callJob(phone){

  if(!phone)
    return;


  window.location.href =
    "tel:" + phone;

}


/* =================================
   PROFILE
================================= */

async function showProfile(){

  hidePages();


  document
    .getElementById(
      "profilePage"
    )
    .style.display="block";


  setNav(
    "navProfile"
  );


  document
    .getElementById(
      "profileContent"
    )
    .innerHTML = `

      <div class="profile-card">

        <div class="avatar">
          👤
        </div>

        <div class="profile-name">

          ${escapeHtml(
            currentUser.name
          )}

        </div>

        <div class="profile-phone">

          📱 ${
            escapeHtml(
              currentUser.phone
            )
          }

        </div>

        <div class="profile-location">

          📍 ${
            escapeHtml(
              currentUser.location
            )
          }

        </div>

      </div>

  `;


  loadMyJobs();

}


/* =================================
   MY JOBS
================================= */

async function loadMyJobs(){

  const box =
    document
      .getElementById(
        "myJobs"
      );


  box.innerHTML =
    `<div class="loading">
      পোস্ট লোড হচ্ছে...
    </div>`;


  try{

    const response =
      await fetch(
        API +
        "/api/my-jobs?phone=" +
        encodeURIComponent(
          currentUser.phone
        )
      );


    const data =
      await response.json();


    if(
      !data.jobs ||
      !data.jobs.length
    ){

      box.innerHTML =
        `<div class="empty">
          আপনি এখনো কোনো কাজ পোস্ট করেননি।
        </div>`;

      return;

    }


    renderJobs(
      data.jobs,
      "myJobs"
    );


  }catch(error){

    box.innerHTML =
      `<div class="empty">
        পোস্ট লোড করা যায়নি।
      </div>`;

  }

}


/* =================================
   NAVIGATION
================================= */

function hidePages(){

  document
    .getElementById(
      "homePage"
    )
    .style.display="none";


  document
    .getElementById(
      "jobsPage"
    )
    .style.display="none";


  document
    .getElementById(
      "profilePage"
    )
    .style.display="none";

}


function showHome(){

  hidePages();


  document
    .getElementById(
      "homePage"
    )
    .style.display="block";


  setNav(
    "navHome"
  );


  loadJobs();

}


function showJobs(){

  hidePages();


  document
    .getElementById(
      "jobsPage"
    )
    .style.display="block";


  setNav(
    "navJobs"
  );


  renderJobs(
    allJobs,
    "allJobs"
  );

}


function setNav(id){

  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  const item =
    document.getElementById(id);


  if(item){

    item.classList.add(
      "active"
    );

  }

}


/* =================================
   POST MODAL
================================= */

function openPostModal(){

  document
    .getElementById(
      "postModal"
    )
    .style.display="block";

}


function closePostModal(){

  document
    .getElementById(
      "postModal"
    )
    .style.display="none";

}


/* =================================
   CHAT
================================= */

function openChat(
  phone,
  name
){

  if(!currentUser){

    alert(
      "আগে লগইন করুন।"
    );

    return;

  }


  if(
    !phone ||
    phone ===
      currentUser.phone
  ){

    return;

  }


  chatUser =
    phone;


  document
    .getElementById(
      "chatTitle"
    )
    .textContent =
      "💬 " +
      (
        name ||
        "Chat"
      );


  document
    .getElementById(
      "chatModal"
    )
    .style.display="block";


  loadChat();


  if(chatTimer){

    clearInterval(
      chatTimer
    );

  }


  chatTimer =
    setInterval(
      loadChat,
      3000
    );

}


function closeChat(){

  document
    .getElementById(
      "chatModal"
    )
    .style.display="none";


  chatUser =
    null;


  if(chatTimer){

    clearInterval(
      chatTimer
    );

    chatTimer =
      null;

  }

}


/* =================================
   LOAD CHAT
================================= */

async function loadChat(){

  if(
    !chatUser ||
    !currentUser
  ){

    return;

  }


  try{

    const response =
      await fetch(
        API +
        "/api/messages?me=" +
        encodeURIComponent(
          currentUser.phone
        ) +
        "&other=" +
        encodeURIComponent(
          chatUser
        )
      );


    const data =
      await response.json();


    if(!response.ok)
      return;


    const box =
      document
        .getElementById(
          "chatMessages"
        );


    if(
      !data.messages ||
      !data.messages.length
    ){

      box.innerHTML =
        `<div class="chat-empty">
          💬 এখনো কোনো বার্তা নেই।<br>
          প্রথম বার্তাটি পাঠান।
        </div>`;

      return;

    }


    box.innerHTML =
      data.messages
        .map(
          message => {

            const mine =
              message.from ===
              currentUser.phone;


            return `

              <div class="
                chat-row
                ${mine ? "mine" : ""}
              ">

                <div class="chat-bubble">

                  ${escapeHtml(
                    message.text
                  )}

                  <div class="chat-time">

                    ${formatDate(
                      message.createdAt
                    )}

                  </div>

                </div>

              </div>

            `;

          }
        )
        .join("");


    box.scrollTop =
      box.scrollHeight;


  }catch(error){

    console.log(
      "Chat error:",
      error
    );

  }

}


/* =================================
   SEND MESSAGE
================================= */

async function sendMessage(){

  if(
    !chatUser ||
    !currentUser
  ){

    return;

  }


  const input =
    document
      .getElementById(
        "chatInput"
      );


  const text =
    input.value.trim();


  if(!text)
    return;


  input.disabled =
    true;


  try{

    const response =
      await fetch(
        API +
        "/api/messages/send",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              from:
                currentUser.phone,

              to:
                chatUser,

              text

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.message ||
        "বার্তা পাঠানো যায়নি।"
      );

      return;

    }


    input.value =
      "";


    await loadChat();


  }catch(error){

    alert(
      "সার্ভারের সঙ্গে যোগাযোগ করা যাচ্ছে না।"
    );

  }finally{

    input.disabled =
      false;

    input.focus();

  }

}


/* =================================
   HELPERS
================================= */

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHtml(
    value
  );

}


function formatDate(date){

  try{

    return new Date(
      date
    ).toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "";

  }

}


/* =================================
   CLOSE MODAL OUTSIDE
================================= */

window.addEventListener(
  "click",
  function(event){

    const post =
      document.getElementById(
        "postModal"
      );

    const chat =
      document.getElementById(
        "chatModal"
      );


    if(event.target === post){

      closePostModal();

    }


    if(event.target === chat){

      closeChat();

    }

  }
);


/* =================================
   START
================================= */

loadSavedUser();

</script>

</body>

</html>
