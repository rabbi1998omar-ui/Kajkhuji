<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1"
>

<meta
 name="theme-color"
 content="#080814"
>

<title>কাজ খুঁজি</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:
 radial-gradient(circle at top,#26124a,#080814 55%);
 color:#fff;
 font-family:
 Arial,
 "Noto Sans Bengali",
 sans-serif;
 min-height:100vh;
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 border:0;
 cursor:pointer;
}

.hidden{
 display:none!important;
}

.app{
 max-width:650px;
 margin:auto;
 min-height:100vh;
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:rgba(8,8,20,.88);
 backdrop-filter:blur(18px);
 border-bottom:1px solid rgba(255,255,255,.08);
 padding:14px;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.logo{
 font-size:23px;
 font-weight:900;
}

.logo span{
 color:#ff4f91;
}

.iconbtn{
 width:42px;
 height:42px;
 border-radius:14px;
 background:#171528;
 color:#fff;
 position:relative;
}

.badge{
 position:absolute;
 right:-3px;
 top:-3px;
 background:#ff397f;
 min-width:19px;
 height:19px;
 border-radius:20px;
 font-size:11px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#27213a;
 border:2px solid #ff4f91;
}

main{
 padding:14px;
}

.hero{
 padding:22px;
 border-radius:26px;
 background:
 linear-gradient(
  135deg,
  rgba(255,79,145,.22),
  rgba(129,76,255,.2)
 );
 border:1px solid rgba(255,255,255,.1);
 margin-bottom:16px;
}

.hero h1{
 margin:0 0 8px;
 font-size:28px;
}

.hero p{
 margin:0;
 color:#c7bfd4;
 line-height:1.6;
}

.card{
 background:rgba(20,18,34,.78);
 border:1px solid rgba(255,255,255,.08);
 border-radius:22px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 15px 35px rgba(0,0,0,.18);
}

input,
textarea,
select{
 width:100%;
 background:#11101d;
 border:1px solid #302b42;
 color:#fff;
 padding:14px;
 border-radius:14px;
 outline:none;
 margin-bottom:10px;
}

textarea{
 min-height:100px;
 resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
 border-color:#9d65ff;
}

.btn{
 width:100%;
 padding:14px;
 border-radius:15px;
 color:#fff;
 font-weight:800;
 background:
 linear-gradient(135deg,#ff4f91,#814cff);
 margin-top:5px;
}

.btn.secondary{
 background:#211d32;
}

.btn.green{
 background:linear-gradient(135deg,#12b981,#087f65);
}

.btn.danger{
 background:linear-gradient(135deg,#ff4d67,#a81735);
}

.row{
 display:flex;
 gap:8px;
}

.row>*{
 flex:1;
}

.chips{
 display:flex;
 gap:8px;
 overflow:auto;
 padding-bottom:5px;
 margin-bottom:12px;
}

.chip{
 white-space:nowrap;
 padding:9px 14px;
 border-radius:30px;
 background:#171528;
 color:#cfc8da;
 border:1px solid #302a40;
}

.chip.active{
 background:#ff4f91;
 color:#fff;
 border-color:#ff4f91;
}

.job{
 padding:16px;
 border-radius:20px;
 background:#141322;
 border:1px solid rgba(255,255,255,.08);
 margin-bottom:12px;
}

.jobtop{
 display:flex;
 gap:10px;
 align-items:center;
}

.jobowner{
 flex:1;
}

.jobowner strong{
 display:block;
}

.muted{
 color:#a9a2b7;
 font-size:13px;
}

.job h3{
 margin:12px 0 8px;
}

.salary{
 color:#55e7a9;
 font-weight:800;
}

.tag{
 display:inline-block;
 background:#261e3b;
 color:#cdb9ff;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 margin:4px 3px 4px 0;
}

.match{
 color:#65e7b1;
 font-weight:800;
 font-size:13px;
}

.jobimg{
 width:100%;
 max-height:220px;
 object-fit:cover;
 border-radius:16px;
 margin-top:10px;
}

.jobactions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-top:12px;
}

.smallbtn{
 padding:11px;
 border-radius:12px;
 background:#211d32;
 color:#fff;
 font-weight:700;
}

.bottom{
 position:fixed;
 left:50%;
 transform:translateX(-50%);
 bottom:0;
 width:100%;
 max-width:650px;
 background:rgba(9,8,18,.95);
 backdrop-filter:blur(18px);
 border-top:1px solid rgba(255,255,255,.08);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 padding:8px 5px;
 z-index:30;
}

.nav{
 background:none;
 color:#aaa;
 font-size:11px;
}

.nav.active{
 color:#ff62a0;
}

.nav b{
 display:block;
 font-size:20px;
 margin-bottom:2px;
}

.fab{
 position:fixed;
 right:20px;
 bottom:85px;
 width:58px;
 height:58px;
 border-radius:50%;
 background:linear-gradient(135deg,#ff4f91,#814cff);
 color:#fff;
 font-size:26px;
 box-shadow:0 10px 30px rgba(255,79,145,.35);
 z-index:25;
}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.authbox{
 width:100%;
 max-width:440px;
 background:rgba(17,15,29,.9);
 border:1px solid rgba(255,255,255,.1);
 border-radius:28px;
 padding:24px;
}

.authbox h1{
 text-align:center;
 margin-top:0;
}

.tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 background:#0d0c16;
 padding:4px;
 border-radius:14px;
 margin-bottom:18px;
}

.tab{
 padding:11px;
 border-radius:11px;
 background:none;
 color:#aaa;
}

.tab.active{
 background:#ff4f91;
 color:#fff;
}

.profilebig{
 width:100px;
 height:100px;
 border-radius:50%;
 object-fit:cover;
 display:block;
 margin:5px auto 15px;
 border:3px solid #ff4f91;
}

.statgrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.stat{
 background:#171528;
 padding:14px 5px;
 border-radius:16px;
 text-align:center;
}

.stat strong{
 display:block;
 font-size:20px;
}

.stat span{
 color:#aaa;
 font-size:11px;
}

.sectiontitle{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:20px 0 10px;
}

.empty{
 text-align:center;
 padding:30px 10px;
 color:#aaa;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 z-index:100;
 display:flex;
 align-items:flex-end;
 justify-content:center;
}

.modalbox{
 width:100%;
 max-width:650px;
 max-height:90vh;
 overflow:auto;
 background:#11101d;
 border-radius:25px 25px 0 0;
 padding:18px;
}

.modalhead{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.close{
 width:38px;
 height:38px;
 border-radius:50%;
 background:#252136;
 color:#fff;
}

.message{
 max-width:80%;
 padding:10px 13px;
 border-radius:15px;
 margin:7px 0;
 background:#211d32;
}

.message.mine{
 margin-left:auto;
 background:#814cff;
}

#messages{
 max-height:45vh;
 overflow:auto;
 padding:5px;
}

.star{
 color:#ffd75a;
 font-size:20px;
}

.verify{
 color:#55e7a9;
 font-size:12px;
}

.notice{
 padding:12px;
 border-radius:14px;
 background:#19162a;
 margin-bottom:8px;
}

@media(max-width:420px){

.hero h1{
 font-size:24px;
}

.jobactions{
 grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div id="auth" class="auth">

 <div class="authbox">

  <h1>💼 কাজ খুঁজি</h1>

  <p class="muted" style="text-align:center">
   কাজ খুঁজুন • কাজ পোস্ট করুন • মানুষের সাথে যোগাযোগ করুন
  </p>

  <div class="tabs">

   <button
    class="tab active"
    id="loginTab"
    onclick="showAuth('login')"
   >
    লগইন
   </button>

   <button
    class="tab"
    id="registerTab"
    onclick="showAuth('register')"
   >
    রেজিস্টার
   </button>

  </div>

  <div id="loginForm">

   <input
    id="loginPhone"
    placeholder="মোবাইল নম্বর"
   >

   <input
    id="loginPin"
    type="password"
    inputmode="numeric"
    maxlength="6"
    placeholder="৬ সংখ্যার PIN"
   >

   <button
    class="btn"
    onclick="login()"
   >
    🔐 লগইন
   </button>

  </div>

  <div
   id="registerForm"
   class="hidden"
  >

   <input
    id="regName"
    placeholder="আপনার নাম"
   >

   <input
    id="regPhone"
    placeholder="মোবাইল নম্বর"
   >

   <input
    id="regLocation"
    placeholder="এলাকা / জেলা"
   >

   <input
    id="regSkills"
    placeholder="দক্ষতা যেমন: ড্রাইভিং, ইলেকট্রিক"
   >

   <input
    id="regPin"
    type="password"
    inputmode="numeric"
    maxlength="6"
    placeholder="৬ সংখ্যার PIN"
   >

   <input
    id="regAvatar"
    type="file"
    accept="image/*"
   >

   <button
    class="btn"
    onclick="register()"
   >
    🚀 অ্যাকাউন্ট তৈরি
   </button>

  </div>

 </div>

</div>


<div
 id="app"
 class="app hidden"
>

<header>

 <div class="top">

  <div class="logo">
   💼 কাজ <span>খুঁজি</span>
  </div>

  <div style="display:flex;gap:7px;align-items:center">

   <button
    class="iconbtn"
    onclick="openNotifications()"
   >
    🔔
    <span
     id="notifyBadge"
     class="badge hidden"
    >
     0
    </span>
   </button>

   <img
    id="topAvatar"
    class="avatar"
    onclick="go('profile')"
   >

  </div>

 </div>

</header>


<main id="content">

</main>


<button
 id="fab"
 class="fab"
 onclick="go('post')"
>
+
</button>


<nav class="bottom">

 <button
  class="nav active"
  data-page="home"
  onclick="go('home')"
 >
  <b>🏠</b>
  হোম
 </button>

 <button
  class="nav"
  data-page="saved"
  onclick="go('saved')"
 >
  <b>❤️</b>
  Saved
 </button>

 <button
  class="nav"
  data-page="applications"
  onclick="go('applications')"
 >
  <b>📥</b>
  আবেদন
 </button>

 <button
  class="nav"
  data-page="myjobs"
  onclick="go('myjobs')"
 >
  <b>💼</b>
  আমার কাজ
 </button>

 <button
  class="nav"
  data-page="profile"
  onclick="go('profile')"
 >
  <b>👤</b>
  প্রোফাইল
 </button>

</nav>

</div>


<!-- APPLY MODAL -->

<div
 id="applyModal"
 class="modal hidden"
>

 <div class="modalbox">

  <div class="modalhead">

   <h2>⚡ এক ক্লিকে আবেদন</h2>

   <button
    class="close"
    onclick="closeModal('applyModal')"
   >
    ×
   </button>

  </div>

  <p
   id="applyJobName"
   class="muted"
  ></p>

  <textarea
   id="applyNote"
   placeholder="নিয়োগদাতাকে কিছু বলতে চাইলে লিখুন"
  ></textarea>

  <button
   class="btn"
   onclick="submitApply()"
  >
   আবেদন পাঠান
  </button>

 </div>

</div>


<!-- CHAT -->

<div
 id="chatModal"
 class="modal hidden"
>

 <div class="modalbox">

  <div class="modalhead">

   <h2 id="chatTitle">💬 মেসেজ</h2>

   <button
    class="close"
    onclick="closeModal('chatModal')"
   >
    ×
   </button>

  </div>

  <div id="messages"></div>

  <div class="row">

   <input
    id="messageInput"
    placeholder="মেসেজ লিখুন..."
   >

   <button
    class="smallbtn"
    onclick="sendMessage()"
   >
    ➤
   </button>

  </div>

 </div>

</div>


<!-- NOTIFICATION -->

<div
 id="notifyModal"
 class="modal hidden"
>

 <div class="modalbox">

  <div class="modalhead">

   <h2>🔔 নোটিফিকেশন</h2>

   <button
    class="close"
    onclick="closeModal('notifyModal')"
   >
    ×
   </button>

  </div>

  <div id="notifications"></div>

 </div>

</div>


<!-- JOB DETAIL -->

<div
 id="jobModal"
 class="modal hidden"
>

 <div class="modalbox">

  <div class="modalhead">

   <h2>💼 কাজের বিস্তারিত</h2>

   <button
    class="close"
    onclick="closeModal('jobModal')"
   >
    ×
   </button>

  </div>

  <div id="jobDetail"></div>

 </div>

</div>


<script>

const API = location.origin;

let user =
 JSON.parse(
  localStorage.getItem("kajkhuji_user") || "null"
 );

let currentPage = "home";

let currentJob = null;

let currentChat = null;

let currentCategory = "সব";


function esc(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function avatar(src){

 if(src && src.startsWith("data:image")){
  return src;
 }

 return "data:image/svg+xml;charset=UTF-8,"+
 encodeURIComponent(`
 <svg xmlns="http://www.w3.org/2000/svg"
 width="200" height="200">
 <rect width="100%" height="100%"
 fill="#211d32"/>
 <text x="50%" y="55%"
 text-anchor="middle"
 font-size="80">👤</text>
 </svg>
 `);

}


function saveUser(){

 localStorage.setItem(
  "kajkhuji_user",
  JSON.stringify(user)
 );

}


function showAuth(type){

 const login =
  document.getElementById("loginForm");

 const register =
  document.getElementById("registerForm");

 const lt =
  document.getElementById("loginTab");

 const rt =
  document.getElementById("registerTab");

 if(type === "login"){

  login.classList.remove("hidden");
  register.classList.add("hidden");

  lt.classList.add("active");
  rt.classList.remove("active");

 }else{

  login.classList.add("hidden");
  register.classList.remove("hidden");

  lt.classList.remove("active");
  rt.classList.add("active");

 }

}


async function register(){

 const avatarFile =
  document.getElementById("regAvatar").files[0];

 let avatarData = "";

 if(avatarFile){

  if(avatarFile.size > 350 * 1024){

   alert("ছবির সাইজ 350KB-এর মধ্যে রাখুন");
   return;

  }

  avatarData =
   await fileToDataURL(avatarFile);

 }

 const data = {

  name:
   document.getElementById("regName").value,

  phone:
   document.getElementById("regPhone").value,

  location:
   document.getElementById("regLocation").value,

  skills:
   document.getElementById("regSkills").value,

  pin:
   document.getElementById("regPin").value,

  avatar:avatarData

 };

 try{

  const res =
   await fetch(API+"/api/register",{

    method:"POST",

    headers:{
     "Content-Type":"application/json"
    },

    body:JSON.stringify(data)

   });

  const result =
   await res.json();

  if(!result.success){

   alert(result.message);
   return;

  }

  user = result.user;

  saveUser();

  alert("অ্যাকাউন্ট তৈরি হয়েছে ❤️");

  startApp();

 }catch(e){

  alert("Server-এর সাথে সংযোগ করা যাচ্ছে না");

 }

}


async function login(){

 const phone =
  document.getElementById("loginPhone").value;

 const pin =
  document.getElementById("loginPin").value;

 try{

  const res =
   await fetch(API+"/api/login",{

    method:"POST",

    headers:{
     "Content-Type":"application/json"
    },

    body:JSON.stringify({
     phone,
     pin
    })

   });

  const result =
   await res.json();

  if(!result.success){

   alert(result.message);
   return;

  }

  user = result.user;

  saveUser();

  startApp();

 }catch(e){

  alert("Server-এর সাথে সংযোগ করা যাচ্ছে না");

 }

}


function startApp(){

 document
  .getElementById("auth")
  .classList.add("hidden");

 document
  .getElementById("app")
  .classList.remove("hidden");

 document
  .getElementById("topAvatar")
  .src = avatar(user.avatar);

 go("home");

 updateNotifications();

}


function logout(){

 localStorage.removeItem("kajkhuji_user");

 location.reload();

}


function go(page){

 currentPage = page;

 document
  .querySelectorAll(".nav")
  .forEach(btn=>{

   btn.classList.toggle(
    "active",
    btn.dataset.page === page
   );

  });

 const fab =
  document.getElementById("fab");

 fab.classList.toggle(
  "hidden",
  page === "post"
 );

 if(page === "home") home();

 if(page === "saved") savedJobs();

 if(page === "applications") applicationsPage();

 if(page === "myjobs") myJobs();

 if(page === "profile") profile();

 if(page === "post") postPage();

}


function home(){

 const c =
  document.getElementById("content");

 c.innerHTML = `

 <section class="hero">

  <h1>কাজ খুঁজি 🚀</h1>

  <p>
   ${esc(user.name)}, আপনার এলাকার কাজ
   খুঁজুন অথবা আপনার প্রয়োজনের জন্য কর্মী খুঁজুন।
  </p>

 </section>

 <div class="card">

  <input
   id="search"
   placeholder="🔎 যেমন: ড্রাইভার, দোকানের কাজ..."
   onkeydown="if(event.key==='Enter')searchJobs()"
  >

  <div class="row">

   <button
    class="btn"
    onclick="searchJobs()"
   >
    🔎 খুঁজুন
   </button>

   <button
    class="btn secondary"
    onclick="voiceSearch()"
   >
    🎤
   </button>

  </div>

 </div>

 <div class="chips">

  ${[
   "সব",
   "রাজমিস্ত্রি",
   "ইলেকট্রিশিয়ান",
   "ড্রাইভার",
   "ডেলিভারি",
   "দোকান",
   "কম্পিউটার",
   "টিউশনি",
   "অন্যান্য"
  ].map(x=>`

   <button
    class="chip ${x===currentCategory?"active":""}"
    onclick="setCategory('${x}')"
   >
    ${x}
   </button>

  `).join("")}

 </div>

 <div class="sectiontitle">

  <h2>🤖 আপনার জন্য</h2>

  <button
   class="smallbtn"
   onclick="loadJobs(true)"
  >
   AI Match
  </button>

 </div>

 <div id="jobs">
  <div class="empty">কাজ খোঁজা হচ্ছে...</div>
 </div>

 `;

 loadJobs(false);

}


function setCategory(category){

 currentCategory = category;

 home();

}


async function loadJobs(match){

 const box =
  document.getElementById("jobs");

 if(!box) return;

 let url =
  API+"/api/jobs?category="+
  encodeURIComponent(currentCategory);

 if(user.location){

  url +=
   "&location="+
   encodeURIComponent(user.location);

 }

 if(match){

  url +=
   "&match=1&phone="+
   encodeURIComponent(user.phone);

 }

 try{

  const res =
   await fetch(url);

  const data =
   await res.json();

  if(!data.jobs.length){

   box.innerHTML =
    `<div class="empty">
      😔 এই এলাকায় এখন কোনো কাজ পাওয়া যায়নি।
     </div>`;

   return;

  }

  box.innerHTML =
   data.jobs.map(jobCard).join("");

 }catch(e){

  box.innerHTML =
   `<div class="empty">
    Server error
   </div>`;

 }

}


function searchJobs(){

 const q =
  document.getElementById("search").value.trim();

 if(!q){

  loadJobs(false);
  return;

 }

 const box =

function voiceSearch(){

 if(!("webkitSpeechRecognition" in window) &&
    !("SpeechRecognition" in window)){

  alert("আপনার browser-এ Voice Search নেই");
  return;

 }

 const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 const recognition =
  new SpeechRecognition();

 recognition.lang = "bn-BD";

 recognition.onresult = e =>{

  const text =
   e.results[0][0].transcript;

  const input =
   document.getElementById("search");

  if(input){

   input.value = text;
   searchJobs();

  }

 };

 recognition.start();

}

   encodeURIComponent(user.phone)+
   "&other="+
   encodeURIComponent(currentChat.phone)
  ).then(r=>r.json());

 box.innerHTML =
  data.messages.length
   ? data.messages.map(m=>`

    <div class="message ${
     m.from === user.phone
      ? "mine"
      : ""
    }">

     ${esc(m.text)}

     <div class="muted">
      ${new Date(m.createdAt)
       .toLocaleTimeString("bn-BD")}
     </div>

    </div>

   `).join("")
   : `<div class="empty">
      এখনো কোনো মেসেজ নেই
      </div>`;

 box.scrollTop = box.scrollHeight;

}


async function sendMessage(){

 const input =
  document.getElementById("messageInput");

 const text =
  input.value.trim();

 if(!text || !currentChat) return;

 const res =
  await fetch(API+"/api/messages/send",{

   method:"POST",

   headers:{
    "Content-Type":"application/json"
   },

   body:JSON.stringify({

    from:user.phone,

    to:currentChat.phone,

    text

   })

  });

 const data =
  await res.json();

 if(data.success){

  input.value = "";

  loadMessages();

 }else{

  alert(data.message);

 }

}


async function openNotifications(){

 document
  .getElementById("notifyModal")
  .classList.remove("hidden");

 const data =
  await fetch(
   API+"/api/notifications?phone="+
   encodeURIComponent(user.phone)
  ).then(r=>r.json());

 document.getElementById("notifications")
  .innerHTML =
  data.notifications.length
   ? data.notifications.map(n=>`

    <div class="notice">

     <strong>
      ${esc(n.title)}
     </strong>

     <p class="muted">
      ${esc(n.text)}
     </p>

     <small class="muted">
      ${new Date(n.createdAt)
       .toLocaleString("bn-BD")}
     </small>

    </div>

   `).join("")
   : `<div class="empty">
      কোনো নতুন নোটিফিকেশন নেই
      </div>`;

 await fetch(API+"/api/notifications/read",{

  method:"POST",

  headers:{
   "Content-Type":"application/json"
  },

  body:JSON.stringify({
   phone:user.phone
  })

 });

 document
  .getElementById("notifyBadge")
  .classList.add("hidden");

}


async function updateNotifications(){

 if(!user) return;

 try{

  const data =
   await fetch(
    API+"/api/notifications?phone="+
    encodeURIComponent(user.phone)
   ).then(r=>r.json());

  const badge =
   document.getElementById("notifyBadge");

  if(data.unreadCount){

   badge.textContent =
    data.unreadCount > 99
     ? "99+"
     : data.unreadCount;

   badge.classList.remove("hidden");

  }else{

   badge.classList.add("hidden");

  }

 }catch(e){}

}


function closeModal(id){

 document
  .getElementById(id)
  .classList.add("hidden");

}


function fileToDataURL(file){

 return new Promise((resolve,reject)=>{

  const reader =
   new FileReader();

  reader.onload =
   ()=>resolve(reader.result);

  reader.onerror =
   reject;

  reader.readAsDataURL(file);

 });

}


/* START */

if(user){

 startApp();

}


/* NOTIFICATION REFRESH */

setInterval(
 updateNotifications,
 20000
);

</script>
