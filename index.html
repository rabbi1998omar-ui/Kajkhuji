<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b12">

<title>কাজ খুঁজি</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:#090910;
  color:#fff;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   AUTH
========================= */

#authPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(
      circle at top,
      #382052 0,
      #15111d 38%,
      #090910 75%
    );
}

.authBox{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  padding:28px;
  backdrop-filter:blur(20px);
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
}

.tagline{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  border:0;
  padding:13px;
  border-radius:13px;
  background:#171720;
  color:#aaa;
}

.tab.active{
  background:linear-gradient(135deg,#ff4f91,#814cff);
  color:#fff;
}

.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.input{
  width:100%;
  border:1px solid rgba(255,255,255,.1);
  background:#111119;
  color:#fff;
  padding:14px 15px;
  border-radius:13px;
  outline:none;
}

.input:focus{
  border-color:#a75cff;
}

.primaryBtn{
  border:0;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#ff4f91,#814cff);
  color:#fff;
  font-weight:700;
  margin-top:4px;
}

.message{
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  background:#191923;
  color:#ddd;
  text-align:center;
  font-size:14px;
}

/* =========================
   APP
========================= */

#appPage{
  min-height:100vh;
  padding-bottom:85px;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px;
  background:rgba(9,9,16,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.headerTitle{
  font-size:22px;
  font-weight:800;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.iconBtn{
  position:relative;
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.08);
  background:#15151e;
  color:#fff;
  border-radius:13px;
  font-size:20px;
}

.badge{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:20px;
  background:#ff3f79;
  color:#fff;
  font-size:10px;
  font-weight:800;
  border:2px solid #090910;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px 15px;
}

/* =========================
   SEARCH
========================= */

.searchBox{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.searchBox input{
  flex:1;
}

.searchBtn{
  width:50px;
  border:0;
  border-radius:13px;
  background:#1a1824;
  color:#fff;
}

/* =========================
   CATEGORIES
========================= */

.sectionTitle{
  font-size:18px;
  font-weight:800;
  margin:20px 0 12px;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:4px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.08);
  background:#13131c;
  color:#ddd;
  border-radius:30px;
  padding:10px 15px;
  white-space:nowrap;
}

.category.active{
  background:linear-gradient(135deg,#ff4f91,#814cff);
  color:#fff;
}

/* =========================
   JOB CARD
========================= */

.jobs{
  display:grid;
  grid-template-columns:1fr;
  gap:13px;
}

.jobCard{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.065),
    rgba(255,255,255,.025)
  );
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:17px;
}

.jobTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.jobTitle{
  font-size:18px;
  font-weight:800;
}

.jobCategory{
  display:inline-block;
  margin-top:6px;
  color:#ff7eab;
  font-size:12px;
}

.jobInfo{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:12px 0;
  color:#aaa;
  font-size:13px;
}

.jobDescription{
  color:#c8c8ce;
  line-height:1.6;
  font-size:14px;
}

.jobOwner{
  color:#aaa;
  font-size:12px;
  margin-top:12px;
}

.jobActions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actionBtn{
  flex:1;
  border:0;
  border-radius:12px;
  padding:11px 8px;
  background:#1b1b27;
  color:#fff;
}

.chatBtn{
  background:linear-gradient(135deg,#814cff,#5c5cff);
}

.callBtn{
  background:#173b2c;
  color:#7cffb0;
}

.deleteBtn{
  background:#391b24;
  color:#ff789d;
}

/* =========================
   PROFILE
========================= */

.profileCard{
  background:#12121b;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:22px;
}

.profileAvatar{
  width:75px;
  height:75px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff4f91,#814cff);
  font-size:30px;
  font-weight:800;
  margin-bottom:14px;
}

.profileName{
  font-size:22px;
  font-weight:800;
}

.profileInfo{
  color:#aaa;
  margin-top:7px;
}

.logoutBtn{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:13px;
  background:#341923;
  color:#ff789d;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  height:72px;
  display:flex;
  justify-content:center;
  background:rgba(10,10,16,.94);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.08);
}

.navInner{
  width:100%;
  max-width:600px;
  display:flex;
}

.navBtn{
  flex:1;
  border:0;
  background:transparent;
  color:#777;
  font-size:12px;
}

.navBtn span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.navBtn.active{
  color:#ff65a0;
}

/* =========================
   FLOAT BUTTON
========================= */

.floatingBtn{
  position:fixed;
  right:18px;
  bottom:88px;
  z-index:25;
  width:57px;
  height:57px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#ff4f91,#814cff);
  color:#fff;
  font-size:28px;
  box-shadow:0 10px 35px rgba(129,76,255,.35);
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modalBox{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  background:#11111a;
  border-radius:25px 25px 0 0;
  padding:20px;
  border:1px solid rgba(255,255,255,.08);
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modalTitle{
  font-size:20px;
  font-weight:800;
}

.closeBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#20202b;
  color:#fff;
  font-size:18px;
}

/* =========================
   NOTIFICATIONS
========================= */

.notificationList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.notificationItem{
  display:flex;
  gap:12px;
  padding:14px;
  border-radius:15px;
  background:#191923;
  border:1px solid rgba(255,255,255,.05);
}

.notificationItem.unread{
  background:#211827;
  border-color:rgba(255,79,145,.2);
}

.notificationIcon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff4f91,#814cff);
  font-size:19px;
}

.notificationText{
  flex:1;
}

.notificationTitle{
  font-weight:700;
  margin-bottom:4px;
}

.notificationBody{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

.notificationTime{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:#777;
}

/* =========================
   CHAT
========================= */

.chatModal{
  align-items:stretch;
}

.chatBox{
  max-width:700px;
  height:100%;
  max-height:none;
  border-radius:0;
  display:flex;
  flex-direction:column;
}

.chatMessages{
  flex:1;
  overflow:auto;
  padding:10px 0;
}

.chatBubbleWrap{
  display:flex;
  margin:7px 0;
}

.chatBubbleWrap.mine{
  justify-content:flex-end;
}

.chatBubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:16px;
  background:#242431;
  color:#eee;
  line-height:1.45;
}

.mine .chatBubble{
  background:linear-gradient(135deg,#814cff,#ff4f91);
}

.chatTime{
  display:block;
  margin-top:4px;
  font-size:10px;
  opacity:.65;
}

.chatInputArea{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.chatInputArea input{
  flex:1;
}

.sendBtn{
  width:52px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#ff4f91,#814cff);
  color:#fff;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){
  .jobs{
    grid-template-columns:1fr 1fr;
  }

  .modal{
    align-items:center;
    padding:20px;
  }

  .modalBox{
    border-radius:25px;
    max-height:85vh;
  }

  .chatBox{
    height:80vh;
  }
}
</style>
</head>

<body>

<!-- =========================
     AUTH PAGE
========================= -->

<section id="authPage">

  <div class="authBox">

    <div class="logo">
      💼 কাজ খুঁজি
    </div>

    <div class="tagline">
      কাজ খুঁজুন, কাজ দিন
    </div>

    <div class="tabs">
      <button
        id="loginTab"
        class="tab active"
        onclick="showLogin()"
      >
        লগইন
      </button>

      <button
        id="registerTab"
        class="tab"
        onclick="showRegister()"
      >
        রেজিস্টার
      </button>
    </div>


    <!-- LOGIN -->

    <div id="loginForm" class="form">

      <input
        id="loginPhone"
        class="input"
        type="tel"
        placeholder="মোবাইল নম্বর"
      >

      <input
        id="loginPin"
        class="input"
        type="password"
        placeholder="PIN"
      >

      <button
        class="primaryBtn"
        onclick="login()"
      >
        লগইন
      </button>

    </div>


    <!-- REGISTER -->

    <div
      id="registerForm"
      class="form hidden"
    >

      <input
        id="registerName"
        class="input"
        type="text"
        placeholder="আপনার নাম"
      >

      <input
        id="registerPhone"
        class="input"
        type="tel"
        placeholder="মোবাইল নম্বর"
      >

      <input
        id="registerLocation"
        class="input"
        type="text"
        placeholder="আপনার এলাকা"
      >

      <input
        id="registerPin"
        class="input"
        type="password"
        placeholder="৪-২০ সংখ্যার PIN"
      >

      <button
        class="primaryBtn"
        onclick="register()"
      >
        অ্যাকাউন্ট তৈরি করুন
      </button>

    </div>

    <div
      id="authMessage"
      class="message hidden"
    ></div>

  </div>

</section>


<!-- =========================
     APP PAGE
========================= -->

<section
  id="appPage"
  class="hidden"
>

  <header class="header">

    <div class="headerTitle">
      💼 কাজ খুঁজি
    </div>

    <div class="headerRight">

      <button
        class="iconBtn"
        onclick="openNotifications()"
        aria-label="Notifications"
      >
        🔔

        <span
          id="notificationBadge"
          class="badge hidden"
        >
          0
        </span>

      </button>

    </div>

  </header>


  <main class="container">

    <!-- HOME -->

    <section id="homeSection">

      <div class="searchBox">

        <input
          id="searchInput"
          class="input"
          type="search"
          placeholder="কাজ খুঁজুন..."
          oninput="searchJobs()"
        >

        <button
          class="searchBtn"
          onclick="searchJobs()"
        >
          🔍
        </button>

      </div>


      <div class="sectionTitle">
        কাজের ধরন
      </div>

      <div class="categories">

        <button
          class="category active"
          onclick="filterCategory('সব',this)"
        >
          সব
        </button>

        <button
          class="category"
          onclick="filterCategory('রাজমিস্ত্রি',this)"
        >
          🧱 রাজমিস্ত্রি
        </button>

        <button
          class="category"
          onclick="filterCategory('ইলেকট্রিশিয়ান',this)"
        >
          ⚡ ইলেকট্রিশিয়ান
        </button>

        <button
          class="category"
          onclick="filterCategory('ড্রাইভার',this)"
        >
          🚗 ড্রাইভার
        </button>

        <button
          class="category"
          onclick="filterCategory('ডেলিভারি',this)"
        >
          📦 ডেলিভারি
        </button>

        <button
          class="category"
          onclick="filterCategory('দোকান',this)"
        >
          🏪 দোকান
        </button>

        <button
          class="category"
          onclick="filterCategory('কম্পিউটার',this)"
        >
          💻 কম্পিউটার
        </button>

        <button
          class="category"
          onclick="filterCategory('টিউশনি',this)"
        >
          📚 টিউশনি
        </button>

        <button
          class="category"
          onclick="filterCategory('অন্যান্য',this)"
        >
          🛠️ অন্যান্য
        </button>

      </div>


      <div class="sectionTitle">
        সাম্প্রতিক কাজ
      </div>

      <div
        id="homeJobs"
        class="jobs"
      ></div>

    </section>


    <!-- ALL JOBS -->

    <section
      id="jobsSection"
      class="hidden"
    >

      <div class="sectionTitle">
        সব কাজ
      </div>

      <div
        id="allJobs"
        class="jobs"
      ></div>

    </section>


    <!-- POST -->

    <section
      id="postSection"
      class="hidden"
    >

      <div class="sectionTitle">
        নতুন কাজ পোস্ট করুন
      </div>

      <div class="profileCard">

        <div class="form">

          <input
            id="jobTitle"
            class="input"
            placeholder="কাজের নাম"
          >

          <input
            id="jobLocation"
            class="input"
            placeholder="কাজের জায়গা"
          >

          <input
            id="jobSalary"
            class="input"
            placeholder="বেতন / পারিশ্রমিক"
          >

          <select
            id="jobCategory"
            class="input"
          >
            <option value="">কাজের ধরন নির্বাচন করুন</option>
            <option>রাজমিস্ত্রি</option>
            <option>ইলেকট্রিশিয়ান</option>
            <option>ড্রাইভার</option>
            <option>ডেলিভারি</option>
            <option>দোকান</option>
            <option>কম্পিউটার</option>
            <option>টিউশনি</option>
            <option>অন্যান্য</option>
          </select>

          <textarea
            id="jobDescription"
            class="input"
            rows="5"
            placeholder="কাজের বিস্তারিত"
          ></textarea>

          <button
            class="primaryBtn"
            onclick="createJob()"
          >
            কাজ পোস্ট করুন
          </button>

          <div
            id="jobMessage"
            class="message hidden"
          ></div>

        </div>

      </div>

    </section>


    <!-- PROFILE -->

    <section
      id="profileSection"
      class="hidden"
    >

      <div class="sectionTitle">
        আমার প্রোফাইল
      </div>

      <div
        id="profileContent"
        class="profileCard"
      ></div>

      <div class="sectionTitle">
        আমার পোস্ট করা কাজ
      </div>

      <div
        id="myJobs"
        class="jobs"
      ></div>

    </section>

  </main>


  <!-- FLOATING POST BUTTON -->

  <button
    class="floatingBtn"
    onclick="openPost()"
  >
    +
  </button>


  <!-- BOTTOM NAV -->

  <nav class="bottomNav">

    <div class="navInner">

      <button
        id="navHome"
        class="navBtn active"
        onclick="showSection('home')"
      >
        <span>🏠</span>
        হোম
      </button>

      <button
        id="navJobs"
        class="navBtn"
        onclick="showSection('jobs')"
      >
        <span>💼</span>
        কাজ
      </button>

      <button
        id="navPost"
        class="navBtn"
        onclick="showSection('post')"
      >
        <span>➕</span>
        পোস্ট
      </button>

      <button
        id="navProfile"
        class="navBtn"
        onclick="showSection('profile')"
      >
        <span>👤</span>
        প্রোফাইল
      </button>

    </div>

  </nav>

</section>


<!-- =========================
     POST MODAL
========================= -->

<div
  id="postModal"
  class="modal hidden"
  onclick="closeModalOutside(event,'postModal')"
>

  <div class="modalBox">

    <div class="modalHeader">

      <div class="modalTitle">
        নতুন কাজ পোস্ট করুন
      </div>

      <button
        class="closeBtn"
        onclick="closePost()"
      >
        ✕
      </button>

    </div>

    <div class="form">

      <input
        id="modalJobTitle"
        class="input"
        placeholder="কাজের নাম"
      >

      <input
        id="modalJobLocation"
        class="input"
        placeholder="কাজের জায়গা"
      >

      <input
        id="modalJobSalary"
        class="input"
        placeholder="বেতন / পারিশ্রমিক"
      >

      <select
        id="modalJobCategory"
        class="input"
      >
        <option value="">কাজের ধরন</option>
        <option>রাজমিস্ত্রি</option>
        <option>ইলেকট্রিশিয়ান</option>
        <option>ড্রাইভার</option>
        <option>ডেলিভারি</option>
        <option>দোকান</option>
        <option>কম্পিউটার</option>
        <option>টিউশনি</option>
        <option>অন্যান্য</option>
      </select>

      <textarea
        id="modalJobDescription"
        class="input"
        rows="5"
        placeholder="কাজের বিস্তারিত"
      ></textarea>

      <button
        class="primaryBtn"
        onclick="createJobFromModal()"
      >
        পোস্ট করুন
      </button>

      <div
        id="modalJobMessage"
        class="message hidden"
      ></div>

    </div>

  </div>

</div>


<!-- =========================
     NOTIFICATION MODAL
========================= -->

<div
  id="notificationModal"
  class="modal hidden"
  onclick="closeModalOutside(event,'notificationModal')"
>

  <div class="modalBox">

    <div class="modalHeader">

      <div class="modalTitle">
        🔔 Notifications
      </div>

      <button
        class="closeBtn"
        onclick="closeNotifications()"
      >
        ✕
      </button>

    </div>

    <div
      id="notificationList"
      class="notificationList"
    >
      <div class="empty">
        Notification লোড হচ্ছে...
      </div>
    </div>

  </div>

</div>


<!-- =========================
     CHAT MODAL
========================= -->

<div
  id="chatModal"
  class="modal chatModal hidden"
>

  <div class="modalBox chatBox">

    <div class="modalHeader">

      <div
        id="chatTitle"
        class="modalTitle"
      >
        Chat
      </div>

      <button
        class="closeBtn"
        onclick="closeChat()"
      >
        ✕
      </button>

    </div>


    <div
      id="chatMessages"
      class="chatMessages"
    ></div>


    <div class="chatInputArea">

      <input
        id="chatInput"
        class="input"
        type="text"
        maxlength="2000"
        placeholder="মেসেজ লিখুন..."
        onkeydown="chatKey(event)"
      >

      <button
        class="sendBtn"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================
   GLOBAL
========================================= */

const API = window.location.origin;

let currentUser = null;
let allJobs = [];
let currentCategory = "সব";

let chatUser = null;
let chatTimer = null;

let notificationTimer = null;


/* =========================================
   HELPERS
========================================= */

function $(id){
  return document.getElementById(id);
}


function showMessage(id,text){
  const el = $(id);

  if(!el) return;

  el.textContent = text;
  el.classList.remove("hidden");
}


function hideMessage(id){
  const el = $(id);

  if(el){
    el.classList.add("hidden");
  }
}


function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){
  return escapeHtml(value);
}


function formatDate(date){
  try{
    return new Date(date).toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      }
    );
  }catch{
    return "";
  }
}


/* =========================================
   AUTH TABS
========================================= */

function showLogin(){

  $("loginForm").classList.remove("hidden");
  $("registerForm").classList.add("hidden");

  $("loginTab").classList.add("active");
  $("registerTab").classList.remove("active");

  hideMessage("authMessage");
}


function showRegister(){

  $("loginForm").classList.add("hidden");
  $("registerForm").classList.remove("hidden");

  $("loginTab").classList.remove("active");
  $("registerTab").classList.add("active");

  hideMessage("authMessage");
}


/* =========================================
   REGISTER
========================================= */

async function register(){

  hideMessage("authMessage");

  const name =
    $("registerName").value.trim();

  const phone =
    $("registerPhone").value.trim();

  const location =
    $("registerLocation").value.trim();

  const pin =
    $("registerPin").value.trim();


  if(!name || !phone || !location || !pin){
    showMessage(
      "authMessage",
      "সব তথ্য পূরণ করুন"
    );
    return;
  }


  if(pin.length < 4){
    showMessage(
      "authMessage",
      "PIN কমপক্ষে ৪ সংখ্যার হতে হবে"
    );
    return;
  }


  try{

    const response =
      await fetch(
        API + "/api/register",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            name,
            phone,
            location,
            pin
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      showMessage(
        "authMessage",
        data.message ||
        "রেজিস্টার করা যায়নি"
      );

      return;
    }


    showMessage(
      "authMessage",
      "অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করুন।"
    );


    $("loginPhone").value = phone;

    $("registerName").value = "";
    $("registerPhone").value = "";
    $("registerLocation").value = "";
    $("registerPin").value = "";

    showLogin();

    $("loginPhone").value = phone;

  }catch(error){

    showMessage(
      "authMessage",
      "সার্ভারের সাথে সংযোগ পাওয়া যায়নি"
    );
  }
}


/* =========================================
   LOGIN
========================================= */

async function login(){

  hideMessage("authMessage");

  const phone =
    $("loginPhone").value.trim();

  const pin =
    $("loginPin").value.trim();


  if(!phone || !pin){

    showMessage(
      "authMessage",
      "মোবাইল নম্বর ও PIN দিন"
    );

    return;
  }


  try{

    const response =
      await fetch(
        API + "/api/login",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            phone,
            pin
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      showMessage(
        "authMessage",
        data.message ||
        "লগইন ব্যর্থ"
      );

      return;
    }


    currentUser = data.user;

    localStorage.setItem(
      "kajKhujiUser",
      JSON.stringify(currentUser)
    );


    openApp();

  }catch(error){

    showMessage(
      "authMessage",
      "সার্ভারের সাথে সংযোগ পাওয়া যায়নি"
    );
  }
}


/* =========================================
   OPEN APP
========================================= */

function openApp(){

  $("authPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");

  showSection("home");

  loadJobs();

  updateProfile();

  loadNotifications();

  startNotificationPolling();
}


/* =========================================
   LOGOUT
========================================= */

function logout(){

  stopNotificationPolling();

  localStorage.removeItem(
    "kajKhujiUser"
  );

  currentUser = null;

  $("appPage").classList.add("hidden");
  $("authPage").classList.remove("hidden");

  showLogin();
}


/* =========================================
   SAVED USER
========================================= */

function loadSavedUser(){

  try{

    const saved =
      localStorage.getItem(
        "kajKhujiUser"
      );

    if(!saved) return;

    const user =
      JSON.parse(saved);

    if(
      user &&
      user.phone &&
      user.name
    ){

      currentUser = user;

      openApp();
    }

  }catch(error){

    localStorage.removeItem(
      "kajKhujiUser"
    );
  }
}


/* =========================================
   NAVIGATION
========================================= */

function showSection(section){

  $("homeSection").classList.add("hidden");
  $("jobsSection").classList.add("hidden");
  $("postSection").classList.add("hidden");
  $("profileSection").classList.add("hidden");

  $("navHome").classList.remove("active");
  $("navJobs").classList.remove("active");
  $("navPost").classList.remove("active");
  $("navProfile").classList.remove("active");


  if(section === "home"){

    $("homeSection").classList.remove("hidden");
    $("navHome").classList.add("active");

    loadJobs();

  }


  if(section === "jobs"){

    $("jobsSection").classList.remove("hidden");
    $("navJobs").classList.add("active");

    renderJobs(
      allJobs,
      "allJobs"
    );

  }


  if(section === "post"){

    $("postSection").classList.remove("hidden");
    $("navPost").classList.add("active");

  }


  if(section === "profile"){

    $("profileSection").classList.remove("hidden");
    $("navProfile").classList.add("active");

    updateProfile();
    loadMyJobs();

  }
}


/* =========================================
   LOAD JOBS
========================================= */

async function loadJobs(){

  try{

    const response =
      await fetch(
        API + "/api/jobs"
      );

    const data =
      await response.json();


    if(data.success){

      allJobs = data.jobs || [];

      renderJobs(
        allJobs.slice(0,20),
        "homeJobs"
      );

      renderJobs(
        allJobs,
        "allJobs"
      );

    }

  }catch(error){

    $("homeJobs").innerHTML =
      `<div class="empty">
        কাজ লোড করা যায়নি
      </div>`;

  }
}


/* =========================================
   RENDER JOBS
========================================= */

function renderJobs(jobsList, elementId){

  const container = $(elementId);

  if(!container) return;


  if(!jobsList.length){

    container.innerHTML =
      `<div class="empty">
        কোনো কাজ পাওয়া যায়নি
      </div>`;

    return;
  }


  container.innerHTML =
    jobsList.map(job => jobCard(job)).join("");
}


/* =========================================
   JOB CARD
========================================= */

function jobCard(job){

  const isMine =
    currentUser &&
    job.phone === currentUser.phone;


  const safePhone =
    escapeAttr(job.phone);

  const safeName =
    escapeAttr(job.ownerName);


  return `
    <article class="jobCard">

      <div class="jobTop">

        <div>
          <div class="jobTitle">
            ${escapeHtml(job.title)}
          </div>

          <div class="jobCategory">
            ${escapeHtml(job.category)}
          </div>
        </div>

      </div>


      <div class="jobInfo">

        <span>
          📍 ${escapeHtml(job.location)}
        </span>

        <span>
          💰 ${escapeHtml(job.salary)}
        </span>

      </div>


      <div class="jobDescription">
        ${escapeHtml(job.description)}
      </div>


      <div class="jobOwner">
        👤 ${escapeHtml(job.ownerName)}
        · ${formatDate(job.createdAt)}
      </div>


      <div class="jobActions">

        ${
          isMine
          ? `
            <button
              class="actionBtn deleteBtn"
              onclick="deleteJob('${escapeAttr(job.id)}')"
            >
              🗑️ মুছুন
            </button>
          `
          : `
            <button
              class="actionBtn chatBtn"
              onclick="openChat('${safePhone}','${safeName}')"
            >
              💬 Chat
            </button>

            <button
              class="actionBtn callBtn"
              onclick="callJob('${safePhone}')"
            >
              📞 Call
            </button>
          `
        }

      </div>

    </article>
  `;
}


/* =========================================
   SEARCH
========================================= */

function searchJobs(){

  const query =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  let filtered =
    allJobs.filter(job => {

      const text = `
        ${job.title}
        ${job.location}
        ${job.category}
        ${job.description}
        ${job.ownerName}
      `.toLowerCase();

      return text.includes(query);
    });


  if(currentCategory !== "সব"){

    filtered =
      filtered.filter(
        job =>
          job.category === currentCategory
      );

  }


  renderJobs(
    filtered,
    "homeJobs"
  );
}


/* =========================================
   CATEGORY FILTER
========================================= */

function filterCategory(category, button){

  currentCategory = category;


  document
    .querySelectorAll(".category")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  if(button){
    button.classList.add("active");
  }


  searchJobs();
}


/* =========================================
   CREATE JOB
========================================= */

async function createJob(){

  hideMessage("jobMessage");

  const title =
    $("jobTitle").value.trim();

  const location =
    $("jobLocation").value.trim();

  const salary =
    $("jobSalary").value.trim();

  const category =
    $("jobCategory").value.trim();

  const description =
    $("jobDescription").value.trim();


  if(
    !title ||
    !location ||
    !salary ||
    !category ||
    !description
  ){

    showMessage(
      "jobMessage",
      "সব তথ্য পূরণ করুন"
    );

    return;
  }


  try{

    const response =
      await fetch(
        API + "/api/jobs",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            phone:currentUser.phone,
            pin:prompt("আপনার PIN দিন"),
            title,
            location,
            salary,
            category,
            description
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      showMessage(
        "jobMessage",
        data.message ||
        "কাজ পোস্ট করা যায়নি"
      );

      return;
    }


    $("jobTitle").value = "";
    $("jobLocation").value = "";
    $("jobSalary").value = "";
    $("jobCategory").value = "";
    $("jobDescription").value = "";


    showMessage(
      "jobMessage",
      "কাজ সফলভাবে পোস্ট হয়েছে ✅"
    );


    await loadJobs();

  }catch(error){

    showMessage(
      "jobMessage",
      "সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না"
    );
  }
}


/* =========================================
   MODAL POST
========================================= */

function openPost(){

  $("postModal").classList.remove("hidden");
}


function closePost(){

  $("postModal").classList.add("hidden");
}


async function createJobFromModal(){

  hideMessage("modalJobMessage");


  const title =
    $("modalJobTitle").value.trim();

  const location =
    $("modalJobLocation").value.trim();

  const salary =
    $("modalJobSalary").value.trim();

  const category =
    $("modalJobCategory").value.trim();

  const description =
    $("modalJobDescription").value.trim();


  if(
    !title ||
    !location ||
    !salary ||
    !category ||
    !description
  ){

    showMessage(
      "modalJobMessage",
      "সব তথ্য পূরণ করুন"
    );

    return;
  }


  const pin =
    prompt("আপনার PIN দিন");


  if(pin === null) return;


  try{

    const response =
      await fetch(
        API + "/api/jobs",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            phone:currentUser.phone,
            pin:pin,
            title,
            location,
            salary,
            category,
            description
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      showMessage(
        "modalJobMessage",
        data.message ||
        "কাজ পোস্ট করা যায়নি"
      );

      return;
    }


    $("modalJobTitle").value = "";
    $("modalJobLocation").value = "";
    $("modalJobSalary").value = "";
    $("modalJobCategory").value = "";
    $("modalJobDescription").value = "";


    closePost();

    await loadJobs();

    showSection("jobs");

  }catch(error){

    showMessage(
      "modalJobMessage",
      "সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না"
    );
  }
}


/* =========================================
   DELETE JOB
========================================= */

async function deleteJob(jobId){

  const ok =
    confirm("এই কাজটি মুছে ফেলবেন?");


  if(!ok) return;


  const pin =
    prompt("আপনার PIN দিন");


  if(pin === null) return;


  try{

    const response =
      await fetch(
        API + "/api/jobs/delete",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            phone:currentUser.phone,
            pin:pin,
            jobId:jobId
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      alert(
        data.message ||
        "কাজ মুছতে সমস্যা হয়েছে"
      );

      return;
    }


    await loadJobs();
    loadMyJobs();

  }catch(error){

    alert("সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না");
  }
}


/* =========================================
   CALL
========================================= */

function callJob(phone){

  if(!phone) return;

  window.location.href =
    "tel:" + phone;
}


/* =========================================
   PROFILE
========================================= */

function updateProfile(){

  if(!currentUser) return;


  const first =
    (currentUser.name || "?")
      .trim()
      .charAt(0)
      .toUpperCase();


  $("profileContent").innerHTML = `

    <div class="profileAvatar">
      ${escapeHtml(first)}
    </div>

    <div class="profileName">
      ${escapeHtml(currentUser.name)}
    </div>

    <div class="profileInfo">
      📱 ${escapeHtml(currentUser.phone)}
    </div>

    <div class="profileInfo">
      📍 ${escapeHtml(currentUser.location || "লোকেশন নেই")}
    </div>

    <button
      class="logoutBtn"
      onclick="logout()"
    >
      🚪 লগআউট
    </button>

  `;
}


/* =========================================
   MY JOBS
========================================= */

async function loadMyJobs(){

  if(!currentUser) return;


  try{

    const response =
      await fetch(
        API +
        "/api/my-jobs?phone=" +
        encodeURIComponent(
          currentUser.phone
        )
      );


    const data =
      await response.json();


    if(data.success){

      renderJobs(
        data.jobs || [],
        "myJobs"
      );

    }

  }catch(error){

    $("myJobs").innerHTML =
      `<div class="empty">
        কাজ লোড করা যায়নি
      </div>`;
  }
}


/* =========================================
   CHAT
========================================= */

function openChat(phone,name){

  if(!currentUser) return;


  if(phone === currentUser.phone){

    alert("নিজের সাথে Chat করা যাবে না");
    return;
  }


  chatUser = {
    phone:phone,
    name:name
  };


  $("chatTitle").textContent =
    "💬 " + name;


  $("chatModal")
    .classList
    .remove("hidden");


  loadChat();


  clearInterval(chatTimer);

  chatTimer =
    setInterval(
      loadChat,
      3000
    );


  setTimeout(() => {
    $("chatInput").focus();
  },100);

}


function closeChat(){

  $("chatModal")
    .classList
    .add("hidden");


  clearInterval(chatTimer);

  chatTimer = null;

  chatUser = null;
}


function chatKey(event){

  if(event.key === "Enter"){

    event.preventDefault();

    sendMessage();
  }
}


/* =========================================
   LOAD CHAT
========================================= */

async function loadChat(){

  if(
    !currentUser ||
    !chatUser
  ) return;


  try{

    const url =
      API +
      "/api/messages?me=" +
      encodeURIComponent(
        currentUser.phone
      ) +
      "&other=" +
      encodeURIComponent(
        chatUser.phone
      );


    const response =
      await fetch(url);


    const data =
      await response.json();


    if(!data.success) return;


    const container =
      $("chatMessages");


    container.innerHTML =
      data.messages
        .map(message => {

          const mine =
            message.from ===
            currentUser.phone;


          return `
            <div class="chatBubbleWrap ${mine ? "mine" : ""}">

              <div class="chatBubble">

                ${escapeHtml(message.text)}

                <span class="chatTime">
                  ${formatDate(message.createdAt)}
                </span>

              </div>

            </div>
          `;

        })
        .join("");


    container.scrollTop =
      container.scrollHeight;


  }catch(error){

    console.log(
      "Chat load error:",
      error
    );
  }
}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

  if(
    !currentUser ||
    !chatUser
  ) return;


  const input =
    $("chatInput");


  const text =
    input.value.trim();


  if(!text) return;


  input.value = "";


  try{

    const response =
      await fetch(
        API + "/api/messages/send",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            from:currentUser.phone,
            to:chatUser.phone,
            text:text
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      alert(
        data.message ||
        "মেসেজ পাঠানো যায়নি"
      );

      input.value = text;

      return;
    }


    await loadChat();

    loadNotifications();

  }catch(error){

    alert(
      "সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না"
    );

    input.value = text;
  }
}


/* =========================================
   NOTIFICATIONS
========================================= */

async function loadNotifications(){

  if(!currentUser) return;


  try{

    const response =
      await fetch(
        API +
        "/api/notifications?phone=" +
        encodeURIComponent(
          currentUser.phone
        )
      );


    const data =
      await response.json();


    if(!data.success) return;


    updateNotificationBadge(
      data.unreadCount || 0
    );


    renderNotifications(
      data.notifications || []
    );


  }catch(error){

    console.log(
      "Notification error:",
      error
    );
  }
}


/* =========================================
   NOTIFICATION BADGE
========================================= */

function updateNotificationBadge(count){

  const badge =
    $("notificationBadge");


  if(!count || count <= 0){

    badge.classList.add("hidden");
    badge.textContent = "";

    return;
  }


  badge.classList.remove("hidden");


  badge.textContent =
    count > 99
      ? "99+"
      : count;
}


/* =========================================
   RENDER NOTIFICATIONS
========================================= */

function renderNotifications(list){

  const container =
    $("notificationList");


  if(!list.length){

    container.innerHTML =
      `
        <div class="empty">
          🔔 এখনো কোনো notification নেই
        </div>
      `;

    return;
  }


  container.innerHTML =
    list.map(item => {

      let icon = "🔔";


      if(item.type === "message"){
        icon = "💬";
      }


      if(item.type === "job"){
        icon = "💼";
      }


      return `
        <div
          class="notificationItem ${item.read ? "" : "unread"}"
        >

          <div class="notificationIcon">
            ${icon}
          </div>

          <div class="notificationText">

            <div class="notificationTitle">
              ${escapeHtml(item.title)}
            </div>

            <div class="notificationBody">
              ${escapeHtml(item.text)}
            </div>

            <div class="notificationTime">
              ${formatDate(item.createdAt)}
            </div>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================
   OPEN NOTIFICATIONS
========================================= */

async function openNotifications(){

  $("notificationModal")
    .classList
    .remove("hidden");


  await loadNotifications();


  await markNotificationsRead();


  updateNotificationBadge(0);


  await loadNotifications();
}


/* =========================================
   CLOSE NOTIFICATIONS
========================================= */

function closeNotifications(){

  $("notificationModal")
    .classList
    .add("hidden");
}


/* =========================================
   MARK NOTIFICATIONS READ
========================================= */

async function markNotificationsRead(){

  if(!currentUser) return;


  try{

    await fetch(
      API + "/api/notifications/read",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          phone:currentUser.phone
        })
      }
    );

  }catch(error){

    console.log(
      "Notification read error:",
      error
    );
  }
}


/* =========================================
   NOTIFICATION POLLING
========================================= */

function startNotificationPolling(){

  stopNotificationPolling();


  notificationTimer =
    setInterval(
      loadNotifications,
      5000
    );
}


function stopNotificationPolling(){

  if(notificationTimer){

    clearInterval(
      notificationTimer
    );

    notificationTimer = null;
  }
}


/* =========================================
   MODAL OUTSIDE CLICK
========================================= */

function closeModalOutside(event,id){

  if(event.target.id === id){

    $(id)
      .classList
      .add("hidden");
  }
}


/* =========================================
   START
========================================= */

loadSavedUser();

</script>
