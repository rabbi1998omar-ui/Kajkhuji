<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<meta name="theme-color" content="#090912">

<title>কাজ খুঁজি</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #32134b,
      #090912 45%,
      #050509
    );

  color:#fff;
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px;
}

/* =========================
   AUTH
========================= */

#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:430px;
  padding:25px;

  background:
    rgba(255,255,255,.07);

  border:1px solid
    rgba(255,255,255,.12);

  border-radius:28px;

  backdrop-filter:blur(20px);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:35px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span{
  color:#ff4f91;
}

.sub{
  text-align:center;
  opacity:.65;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  padding:13px;
  border-radius:14px;
  background:#171522;
  color:#aaa;
}

.tabs button.active{
  background:
    linear-gradient(
      135deg,
      #ff4f91,
      #814cff
    );
  color:white;
}

input,
textarea,
select{
  width:100%;
  padding:14px 16px;
  margin-bottom:12px;

  color:white;
  background:#11101a;

  border:1px solid
    rgba(255,255,255,.12);

  border-radius:14px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#ff4f91;
}

.primary{
  width:100%;
  padding:15px;

  color:white;
  font-weight:800;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #ff4f91,
      #814cff
    );
}

.msg{
  text-align:center;
  margin-top:12px;
  color:#ff8db5;
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
  padding-bottom:90px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:15px 18px;

  background:
    rgba(8,8,15,.82);

  backdrop-filter:blur(20px);

  border-bottom:1px solid
    rgba(255,255,255,.08);
}

.brand{
  font-size:24px;
  font-weight:900;
}

.brand span{
  color:#ff4f91;
}

.topActions{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:42px;
  height:42px;

  border-radius:50%;

  color:white;
  background:#191723;

  border:1px solid
    rgba(255,255,255,.08);
}

/* =========================
   HERO
========================= */

.hero{
  padding:25px 0;
}

.heroCard{
  padding:25px;
  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(255,79,145,.22),
      rgba(129,76,255,.20)
    );

  border:1px solid
    rgba(255,255,255,.1);
}

.heroCard h1{
  font-size:32px;
  line-height:1.2;
  margin-bottom:10px;
}

.heroCard p{
  opacity:.7;
}

/* =========================
   SEARCH
========================= */

.searchRow{
  display:flex;
  gap:8px;
  margin:18px 0;
}

.searchRow input{
  margin:0;
}

.voice{
  min-width:50px;
  border-radius:14px;
  background:#211c2c;
  color:white;
}

/* =========================
   CATEGORY
========================= */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}

.cat{
  white-space:nowrap;
  padding:10px 16px;

  border-radius:30px;

  color:#ddd;
  background:#15131f;

  border:1px solid
    rgba(255,255,255,.08);
}

.cat.active{
  background:#ff4f91;
  color:white;
}

/* =========================
   JOB CARD
========================= */

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:20px 0 12px;
}

.sectionTitle h2{
  font-size:20px;
}

.jobGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));

  gap:14px;
}

.job{
  overflow:hidden;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:22px;

  transition:.2s;
}

.job:hover{
  transform:translateY(-3px);
}

.jobImage{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#14121d;
}

.jobBody{
  padding:16px;
}

.jobTitle{
  font-size:19px;
  font-weight:800;
  margin-bottom:8px;
}

.meta{
  font-size:13px;
  opacity:.65;
  margin:5px 0;
}

.salary{
  color:#6fffa1;
  font-weight:800;
  margin:10px 0;
}

.badge{
  display:inline-block;

  padding:5px 9px;

  border-radius:20px;

  font-size:11px;

  background:#211b2d;
  color:#ff8db5;
}

.match{
  color:#73ffad;
  font-size:12px;
  margin-top:8px;
}

.jobButtons{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.jobButtons button{
  flex:1;
  padding:11px;
  border-radius:12px;
  color:white;
  background:#211d2c;
}

.jobButtons .apply{
  background:
    linear-gradient(
      135deg,
      #ff4f91,
      #814cff
    );
}

/* =========================
   PROFILE
========================= */

.profileCard{
  text-align:center;

  padding:25px;

  background:
    rgba(255,255,255,.06);

  border-radius:28px;

  border:1px solid
    rgba(255,255,255,.1);
}

.profileAvatar{
  position:relative;

  width:120px;
  height:120px;

  margin:0 auto 12px;

  border-radius:50%;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #ff4f91,
      #814cff
    );

  border:4px solid
    rgba(255,255,255,.2);
}

.profileAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatarPlaceholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:48px;
}

.changePhoto{
  margin:12px auto 20px;
  display:block;

  padding:10px 18px;

  border-radius:20px;

  color:white;

  background:#211c2d;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin:18px 0;
}

.stat{
  padding:15px;

  background:#15131e;
  border-radius:16px;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat small{
  opacity:.55;
}

/* =========================
   NAV
========================= */

.bottomNav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:30;

  display:flex;
  justify-content:center;

  padding:10px;

  background:
    rgba(8,8,14,.92);

  backdrop-filter:blur(20px);

  border-top:
    1px solid rgba(255,255,255,.08);
}

.navInner{
  width:100%;
  max-width:650px;

  display:grid;
  grid-template-columns:
    repeat(5,1fr);

  gap:5px;
}

.navItem{
  padding:8px 4px;

  text-align:center;

  color:#888;

  background:transparent;
}

.navItem.active{
  color:#ff6ca4;
}

.navIcon{
  display:block;
  font-size:20px;
}

.navText{
  font-size:10px;
}

/* =========================
   FAB
========================= */

.fab{
  position:fixed;

  right:20px;
  bottom:85px;

  width:58px;
  height:58px;

  border-radius:50%;

  color:white;
  font-size:25px;

  background:
    linear-gradient(
      135deg,
      #ff4f91,
      #814cff
    );

  box-shadow:
    0 10px 30px
    rgba(255,79,145,.3);

  z-index:25;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  background:
    rgba(0,0,0,.7);

  padding:15px;
}

.modalBox{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;

  padding:22px;

  background:#11101a;

  border:
    1px solid rgba(255,255,255,.12);

  border-radius:25px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:18px;
}

.close{
  width:38px;
  height:38px;

  border-radius:50%;

  color:white;
  background:#211e2c;
}

/* =========================
   AVATAR PREVIEW
========================= */

.preview{
  width:120px;
  height:120px;

  margin:10px auto 18px;

  border-radius:50%;

  overflow:hidden;

  background:#1b1824;

  border:3px solid #ff4f91;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:95px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index:200;

  padding:13px 18px;

  border-radius:15px;

  background:#24202f;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.4);

  opacity:0;
  pointer-events:none;

  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .container{
    padding:14px;
  }

  .heroCard h1{
    font-size:27px;
  }

  .jobGrid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<!-- =========================
     AUTH
========================= -->

<section id="auth">

  <div class="authBox">

    <div class="logo">
      কাজ <span>খুঁজি</span>
    </div>

    <div class="sub">
      কাজ খুঁজুন • কাজ দিন • সুযোগ তৈরি করুন
    </div>

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showLogin()"
      >
        Login
      </button>

      <button
        id="registerTab"
        onclick="showRegister()"
      >
        Register
      </button>

    </div>

    <div id="loginForm">

      <input
        id="loginPhone"
        type="tel"
        placeholder="ফোন নম্বর"
      >

      <input
        id="loginPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="৬ সংখ্যার PIN"
      >

      <button
        class="primary"
        onclick="login()"
      >
        Login
      </button>

    </div>

    <div
      id="registerForm"
      class="hidden"
    >

      <input
        id="regName"
        placeholder="আপনার নাম"
      >

      <input
        id="regPhone"
        type="tel"
        placeholder="ফোন নম্বর"
      >

      <input
        id="regLocation"
        placeholder="এলাকা / জেলা"
      >

      <input
        id="regSkills"
        placeholder="দক্ষতা, যেমন: Driver, Electrician"
      >

      <input
        id="regPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="৬ সংখ্যার PIN"
      >

      <label
        style="
          display:block;
          margin:8px 0;
          opacity:.7;
          font-size:13px;
        "
      >
        Profile Picture
      </label>

      <input
        id="regAvatar"
        type="file"
        accept="image/*"
        onchange="previewRegisterPhoto(event)"
      >

      <div
        id="regPreview"
        class="preview hidden"
      >
        <img id="regPreviewImg">
      </div>

      <button
        class="primary"
        onclick="register()"
      >
        Account তৈরি করুন
      </button>

    </div>

    <div
      id="authMsg"
      class="msg"
    ></div>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<section
  id="app"
  class="hidden"
>

  <header class="topbar">

    <div class="brand">
      কাজ <span>খুঁজি</span>
    </div>

    <div class="topActions">

      <button
        class="iconBtn"
        onclick="showNotifications()"
      >
        🔔
      </button>

      <button
        class="iconBtn"
        onclick="profilePage()"
      >
        👤
      </button>

    </div>

  </header>


  <main class="container">

    <!-- HOME -->

    <section id="homePage">

      <div class="hero">

        <div class="heroCard">

          <h1>
            আপনার পরবর্তী কাজটি
            এখানেই খুঁজুন 🔎
          </h1>

          <p>
            কাছাকাছি কাজ, নতুন সুযোগ এবং
            দক্ষতা অনুযায়ী Job Match।
          </p>

        </div>

      </div>


      <div class="searchRow">

        <input
          id="searchInput"
          placeholder="কাজের নাম / জায়গা লিখুন..."
          oninput="searchJobs()"
        >

        <button
          class="voice"
          onclick="voiceSearch()"
        >
          🎤
        </button>

      </div>


      <div class="categories">

        <button
          class="cat active"
          onclick="categorySearch('',this)"
        >
          সব
        </button>

        <button
          class="cat"
          onclick="categorySearch('Driver',this)"
        >
          🚗 Driver
        </button>

        <button
          class="cat"
          onclick="categorySearch('Electrician',this)"
        >
          ⚡ Electrician
        </button>

        <button
          class="cat"
          onclick="categorySearch('Delivery',this)"
        >
          📦 Delivery
        </button>

        <button
          class="cat"
          onclick="categorySearch('Shop',this)"
        >
          🏪 Shop
        </button>

        <button
          class="cat"
          onclick="categorySearch('Computer',this)"
        >
          💻 Computer
        </button>

      </div>


      <div class="sectionTitle">

        <h2>
          Job Opportunities
        </h2>

        <button
          class="badge"
          onclick="matchJobs()"
        >
          ✨ AI Match
        </button>

      </div>

      <div
        id="jobList"
        class="jobGrid"
      ></div>

    </section>


    <!-- SAVED -->

    <section
      id="savedPage"
      class="hidden"
    >

      <div class="sectionTitle">
        <h2>❤️ Saved Jobs</h2>
      </div>

      <div
        id="savedList"
        class="jobGrid"
      ></div>

    </section>


    <!-- APPLICATIONS -->

    <section
      id="applicationsPage"
      class="hidden"
    >

      <div class="sectionTitle">
        <h2>📋 Applications</h2>
      </div>

      <div id="applicationsList"></div>

    </section>


    <!-- MY JOBS -->

    <section
      id="myJobsPage"
      class="hidden"
    >

      <div class="sectionTitle">
        <h2>📢 My Jobs</h2>
      </div>

      <div
        id="myJobsList"
        class="jobGrid"
      ></div>

    </section>


    <!-- PROFILE -->

    <section
      id="profilePage"
      class="hidden"
    >

      <div class="profileCard">

        <div class="profileAvatar">

          <img
            id="profileImage"
            class="hidden"
          >

          <div
            id="profilePlaceholder"
            class="avatarPlaceholder"
          >
            👤
          </div>

        </div>

        <!-- REAL PROFILE IMAGE UPLOAD -->

        <button
          class="changePhoto"
          onclick="document.getElementById('profilePhoto').click()"
        >
          📷 Profile Picture পরিবর্তন
        </button>

        <input
          id="profilePhoto"
          type="file"
          accept="image/*"
          class="hidden"
          onchange="uploadProfilePhoto(event)"
        >

        <h2 id="profileName">
          User
        </h2>

        <p
          id="profileLocation"
          class="meta"
        ></p>


        <div class="stats">

          <div class="stat">
            <b id="myJobCount">0</b>
            <small>Jobs</small>
          </div>

          <div class="stat">
            <b id="myApplyCount">0</b>
            <small>Applications</small>
          </div>

          <div class="stat">
            <b id="profileRating">0</b>
            <small>Rating</small>
          </div>

        </div>


        <input
          id="editName"
          placeholder="নাম"
        >

        <input
          id="editLocation"
          placeholder="এলাকা / জেলা"
        >

        <input
          id="editSkills"
          placeholder="দক্ষতা"
        >

        <textarea
          id="editBio"
          placeholder="নিজের সম্পর্কে লিখুন"
        ></textarea>

        <textarea
          id="editCV"
          placeholder="আপনার CV / অভিজ্ঞতা লিখুন"
        ></textarea>

        <input
          id="editPin"
          type="password"
          maxlength="6"
          placeholder="বর্তমান ৬ সংখ্যার PIN"
        >

        <button
          class="primary"
          onclick="saveProfile()"
        >
          💾 Profile Save
        </button>

        <br>

        <button
          class="changePhoto"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </section>

  </main>


  <!-- FAB -->

  <button
    class="fab"
    onclick="postJob()"
  >
    ＋
  </button>


  <!-- BOTTOM NAV -->

  <nav class="bottomNav">

    <div class="navInner">

      <button
        class="navItem active"
        onclick="goHome(this)"
      >
        <span class="navIcon">🏠</span>
        <span class="navText">Home</span>
      </button>

      <button
        class="navItem"
        onclick="savedPage(this)"
      >
        <span class="navIcon">❤️</span>
        <span class="navText">Saved</span>
      </button>

      <button
        class="navItem"
        onclick="applicationsPage(this)"
      >
        <span class="navIcon">📋</span>
        <span class="navText">Apply</span>
      </button>

      <button
        class="navItem"
        onclick="myJobsPage(this)"
      >
        <span class="navIcon">📢</span>
        <span class="navText">My Jobs</span>
      </button>

      <button
        class="navItem"
        onclick="profilePage(this)"
      >
        <span class="navIcon">👤</span>
        <span class="navText">Profile</span>
      </button>

    </div>

  </nav>

</section>


<!-- =========================
     MODAL
========================= -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modalBox">

    <div class="modalHead">

      <h2 id="modalTitle">
        Details
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

const API = location.origin;

let user =
  JSON.parse(
    localStorage.getItem("kajkhuji_user") ||
    "null"
  );

let currentJob = null;
let selectedCategory = "";


/* =========================
   BASIC HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function toast(message){

  $("toast").textContent = message;

  $("toast").classList.add("show");

  setTimeout(() => {
    $("toast").classList.remove("show");
  },2500);
}

function saveUser(){
  localStorage.setItem(
    "kajkhuji_user",
    JSON.stringify(user)
  );
}


/* =========================
   AUTH
========================= */

function showLogin(){

  $("loginForm").classList.remove("hidden");
  $("registerForm").classList.add("hidden");

  $("loginTab").classList.add("active");
  $("registerTab").classList.remove("active");

  $("authMsg").textContent="";
}

function showRegister(){

  $("loginForm").classList.add("hidden");
  $("registerForm").classList.remove("hidden");

  $("loginTab").classList.remove("active");
  $("registerTab").classList.add("active");

  $("authMsg").textContent="";
}


/* =========================
   IMAGE TO BASE64
========================= */

function imageToBase64(file,maxSizeMB=1){

  return new Promise((resolve,reject)=>{

    if(!file){
      resolve("");
      return;
    }

    if(!file.type.startsWith("image/")){
      reject(
        new Error("শুধু Image নির্বাচন করুন")
      );
      return;
    }

    if(
      file.size >
      maxSizeMB * 1024 * 1024
    ){
      reject(
        new Error(
          "ছবির size 1MB-এর কম হতে হবে"
        )
      );
      return;
    }

    const reader =
      new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=()=>{
      reject(
        new Error("ছবি পড়া যায়নি")
      );
    };

    reader.readAsDataURL(file);
  });
}

function voiceSearch(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    toast(
      "আপনার browser Voice Search support করে না"
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang="bn-BD";

  recognition.start();

  recognition.onresult =
    event => {

      const text =
        event
          .results[0][0]
          .transcript;

      $("searchInput").value=text;

      searchJobs();
    };
}

    <textarea
      id="jobDescription"
      placeholder="Job সম্পর্কে বিস্তারিত লিখুন"
    ></textarea>

    <label
      style="
        display:block;
        opacity:.7;
        margin:8px 0;
      "
    >
      Job-এর ছবি
    </label>

    <input
      id="jobImage"
      type="file"
      accept="image/*"
    >

    <button
      class="primary"
      onclick="createJob()"
    >
      📢 Job Publish
    </button>

  `;

  openModal();
}


async function createJob(){

  const title =
    $("jobTitle").value.trim();

  const location =
    $("jobLocation").value.trim();

  const salary =
    $("jobSalary").value.trim();

  const category =
    $("jobCategory").value.trim();

  const description =
    $("jobDescription").value.trim();

  const file =
    $("jobImage").files[0];

  if(!title || !location || !description){

    toast(
      "Title, location ও description দিন"
    );

    return;
  }

  try{

    let image="";

    if(file){

      image =
        await imageToBase64(
          file,
          1
        );
    }

    const pin =
      prompt(
        "Job publish করতে আপনার ৬ সংখ্যার PIN দিন"
      );

    if(!pin) return;

    const response =
      await fetch(
        API+"/api/jobs",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({

            phone:user.phone,
            pin,

            title,
            location,
            salary,
            category,
            description,
            image

          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      toast(
        data.error ||
        "Job publish হয়নি"
      );

      return;
    }

    closeModal();

    toast(
      "Job সফলভাবে Publish হয়েছে 🎉"
    );

    loadJobs();

  }catch(e){

    toast(
      e.message ||
      "Server error"
    );
  }
}


/* =========================
   NOTIFICATIONS
========================= */

async function showNotifications(){

  const response =
    await fetch(
      API+
      "/api/notifications?phone="+
      encodeURIComponent(user.phone)
    );

  const data =
    await response.json();

  $("modalTitle").textContent =
    "🔔 Notifications";

  const list =
    data.notifications || [];

  $("modalContent").innerHTML =
    list.length
      ? list.map(n=>`

          <div
            style="
              padding:15px;
              margin-bottom:10px;
              border-radius:15px;
              background:#1a1724;
            "
          >

            <b>
              ${esc(n.title)}
            </b>

            <p
              style="
                opacity:.7;
                margin-top:5px;
              "
            >
              ${esc(n.message)}
            </p>

          </div>

        `).join("")
      : `
        <div class="profileCard">
          কোনো Notification নেই।
        </div>
      `;

  openModal();

  fetch(
    API+"/api/notifications/read",
    {
      method:"POST",
      headers:{
        "Content-Type":
          "application/json"
      },
      body:JSON.stringify({
        phone:user.phone
      })
    }
  );
}


/* =========================
   MODAL
========================= */

function openModal(){

  $("modal")
    .classList
    .remove("hidden");
}

function closeModal(){

  $("modal")
    .classList
    .add("hidden");
}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "kajkhuji_user"
  );

  location.reload();
}


/* =========================
   AUTO LOGIN
========================= */

if(user){

  startApp();

}

</script>
